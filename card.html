<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세이스강(SEISKANG) 이윤재 - 모바일 명함</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b1329; /* 다크블루 배경 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card-container {
            width: 100%;
            max-width: 420px;
            background-color: #121c38;
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        /* 프로필 사진 영역 (전화 링크 적용) */
        .profile-link {
            display: inline-block;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #3b82f6;
            margin-bottom: 20px;
            transition: transform 0.2s ease;
        }
        .profile-link:hover {
            transform: scale(1.05);
        }
        .profile-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 머리카락 위 여백 조정 수치 (필요시 수정) */
            object-position: center 10px; 
        }
        /* 이름 스타일 (줄바꿈 방지) */
        .name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            white-space: nowrap;
            color: #ffffff;
        }
        /* 프로필 아래 2줄 텍스트 (흰색 변경 적용) */
        .bio {
            font-size: 14px;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .bio p {
            margin-bottom: 4px;
        }
        /* 링크 버튼 스타일 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e293b;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s, border-color 0.2s;
        }
        .link-btn:hover {
            background-color: #283548;
            border-color: #3b82f6;
        }
        /* 하단 카피라이트 */
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #8a99ad;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 프로필 사진 터치 시 전화 연결 (tel:010-4042-2419) -->
        <a href="tel:010-4042-2419" class="profile-link" title="전화 걸기">
            <img src="profile.png" alt="세이스강 프로필 사진">
        </a>

        <!-- 이름 (줄바꿈 방지 적용) -->
        <h1 class="name">세이스강(SEISKANG) 이윤재</h1>

        <!-- 프로필 아래 2줄 텍스트 (흰색 적용) -->
        <div class="bio">
            <p>세상을 이롭게 하는 스마트한 강사</p>
            <p>시니어 AI & 스마트 라이프</p>
        </div>

        <!-- 4대 공식 채널 링크 버튼 -->
        <div class="link-list">
            <a href="https://seiskang.kr" class="link-btn" target="_blank">🌐 세이스강 공식 홈페이지</a>
            <a href="https://blog.naver.com/kacipi" class="link-btn" target="_blank">📝 네이버 블로그</a>
            <a href="https://youtube.com/@seisgang" class="link-btn" target="_blank">📺 유튜브 채널 (@seisgang)</a>
            <a href="mailto:kacipi@naver.com" class="link-btn">✉️ 강의 및 협업 문의 (이메일)</a>
        </div>

        <!-- 하단 저작권 -->
        <div class="footer">
            &copy; 세이스강(SEISKANG) 이윤재. All rights reserved.
        </div>
    </div>

</body>
</html>
