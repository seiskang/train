<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seiskang Trader | 세이스강 주식 매매 파트너 (큰글씨·고대비)</title>
  <!-- Google Fonts: IBM Plex Sans KR, IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            samsung: {
              50: '#eef3fb',
              500: '#1428a0',
              600: '#0f1f80',
              700: '#0a155c'
            },
            stock: {
              up: '#ef4444',
              upLight: '#dc2626',
              down: '#2563eb',
              downLight: '#1d4ed8'
            }
          },
          fontFamily: {
            sans: ['"IBM Plex Sans KR"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'IBM Plex Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .tabular { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-28 transition-colors duration-200">

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-40 bg-slate-900/95 border-b border-slate-700 px-4 py-3.5 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-samsung-500 flex items-center justify-center font-extrabold text-white text-lg shadow-lg">
        S
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-2">
          SEISKANG TRADER
          <span id="marketBadgeHeader" class="text-xs px-2 py-0.5 rounded-md bg-samsung-500 text-white font-mono font-bold">SOR 통합</span>
        </h1>
        <p class="text-xs text-slate-300 mt-0.5">삼성증권 연동 · 08:00~20:00 풀타임</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <!-- 밝게/어둡게 토글 -->
      <button onclick="toggleTheme()" id="themeBtn" 
              class="text-xs font-bold px-2.5 py-2 rounded-xl bg-slate-800 border border-slate-600 text-amber-300 hover:bg-slate-700 transition">
        ☀️ 밝게
      </button>
      <!-- 삼성증권 mPOP 공식 정식 런처 링크 -->
      <a href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.samsungpop.android.mpop;end" 
         class="flex items-center gap-1.5 text-xs font-bold bg-samsung-500 hover:bg-samsung-600 active:scale-95 text-white px-3 py-2 rounded-xl shadow transition">
        <span>mPOP 주문</span>
      </a>
    </div>
  </header>

  <!-- 거래시장 3단 셀렉터 -->
  <div class="bg-slate-900 border-b border-slate-700 px-4 py-2.5">
    <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-700 text-sm font-bold">
      <button onclick="setMarketMode('TOTAL')" id="tabModeTOTAL" 
              class="py-2.5 rounded-lg text-center transition bg-samsung-500 text-white shadow-md">
        🌟 통합 (SOR)
      </button>
      <button onclick="setMarketMode('KRX')" id="tabModeKRX" 
              class="py-2.5 rounded-lg text-center transition text-slate-300 hover:text-white">
        🏛️ KRX (거래소)
      </button>
      <button onclick="setMarketMode('NXT')" id="tabModeNXT" 
              class="py-2.5 rounded-lg text-center transition text-slate-300 hover:text-white">
        ⚡ NXT (대체장)
      </button>
    </div>
  </div>

  <!-- 실시간 세션 배너 -->
  <div class="bg-slate-900/80 border-b border-slate-700 px-4 py-2 flex items-center justify-between text-xs sm:text-sm">
    <div class="flex items-center gap-2">
      <span id="marketStatusDot" class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="marketStatusText" class="text-white font-bold">시장 상태 조회 중...</span>
    </div>
    <span id="liveClock" class="font-mono text-slate-200 font-bold tabular text-sm">00:00:00</span>
  </div>

  <!-- 메인 레이아웃 -->
  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- 포트폴리오 총괄 요약 카드 -->
    <section class="bg-slate-900 border-2 border-slate-700 p-4 sm:p-5 rounded-2xl shadow-xl space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <span class="text-sm font-bold text-slate-200">내 자산 실현손익 현황</span>
        <div class="flex items-center gap-2">
          <span class="text-xs text-amber-300 bg-amber-950/60 border border-amber-500/50 px-2 py-0.5 rounded font-bold">제비용 0.21% 공제</span>
          <span id="totalStockCount" class="font-mono text-xs text-white bg-slate-800 px-2.5 py-0.5 rounded-full font-bold border border-slate-600">5개 종목</span>
        </div>
      </div>

      <div class="p-3.5 bg-slate-950 rounded-xl border border-slate-700 flex justify-between items-center">
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-0.5">제비용 제외 순 실현손익</span>
          <p id="totalNetPnL" class="font-mono text-xl sm:text-2xl font-extrabold tabular text-white">0 원</p>
        </div>
        <div class="text-right">
          <span class="text-xs font-bold text-slate-400 block mb-0.5">순 수익률</span>
          <p id="totalNetRate" class="font-mono text-base sm:text-lg font-extrabold tabular text-white">0.00%</p>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 pt-1 text-xs sm:text-sm">
        <div class="bg-slate-950/70 p-2 rounded-lg border border-slate-800">
          <span class="text-slate-400 block font-medium">총 매수원금</span>
          <span id="totalInvestment" class="font-mono text-white font-bold tabular mt-0.5 block">0 원</span>
        </div>
        <div class="bg-slate-950/70 p-2 rounded-lg border border-slate-800">
          <span class="text-slate-400 block font-medium">총 평가금액</span>
          <span id="totalValuation" class="font-mono text-white font-bold tabular mt-0.5 block">0 원</span>
        </div>
        <div class="bg-slate-950/70 p-2 rounded-lg border border-slate-800 text-right">
          <span class="text-slate-400 block font-medium">예상 제비용</span>
          <span id="totalFees" class="font-mono text-amber-300 font-bold tabular mt-0.5 block">0 원</span>
        </div>
      </div>
    </section>

    <!-- 검색 및 툴바 -->
    <div class="flex items-center justify-between gap-2 pt-1">
      <div class="relative flex-1">
        <input type="text" id="searchInput" placeholder="종목명 또는 코드 검색..." 
               class="w-full bg-slate-900 text-sm font-medium text-white placeholder-slate-400 rounded-xl px-3 py-3 pl-9 border-2 border-slate-700 focus:outline-none focus:border-samsung-500 transition">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <button onclick="openAddModal()" 
              class="flex items-center gap-1.5 text-sm font-bold bg-samsung-500 hover:bg-samsung-600 active:scale-95 text-white px-3.5 py-3 rounded-xl shadow transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
        <span>종목추가</span>
      </button>
      <button onclick="resetToDefaults()" title="기본 5대 종목 복원" 
              class="text-slate-300 hover:text-white p-3 rounded-xl bg-slate-900 border-2 border-slate-700 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
      </button>
    </div>

    <!-- 종목 카드 리스트 -->
    <div id="stockList" class="space-y-4"></div>

  </main>

  <!-- 10단계 호가창 모달 -->
  <div id="orderBookModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-900 border-t-2 sm:border-2 border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-4 sm:p-5 shadow-2xl space-y-3.5 max-h-[92vh] overflow-y-auto">
      
      <div class="flex justify-between items-start pb-2 border-b border-slate-700">
        <div>
          <div class="flex items-center gap-2">
            <h3 id="obStockName" class="text-lg font-extrabold text-white">-</h3>
            <span id="obStockCode" class="font-mono text-xs text-white bg-slate-800 px-2 py-0.5 rounded font-bold border border-slate-600">-</span>
          </div>
          <p class="text-xs text-slate-300 mt-1">KRX · NXT 통합 10호가 및 수급 비교</p>
        </div>
        <button onclick="closeOrderBook()" class="text-slate-300 hover:text-white text-xl font-bold p-2">✕</button>
      </div>

      <div class="grid grid-cols-3 bg-slate-950 p-1.5 rounded-xl border border-slate-700 text-xs sm:text-sm font-bold">
        <button onclick="renderOrderBookRows('TOTAL')" id="obTabTOTAL" class="py-2 rounded-lg text-center bg-samsung-500 text-white shadow">
          통합 10호가
        </button>
        <button onclick="renderOrderBookRows('KRX')" id="obTabKRX" class="py-2 rounded-lg text-center text-slate-300 hover:text-white">
          KRX 전용
        </button>
        <button onclick="renderOrderBookRows('NXT')" id="obTabNXT" class="py-2 rounded-lg text-center text-slate-300 hover:text-white">
          NXT 전용
        </button>
      </div>

      <div class="border-2 border-slate-700 rounded-xl overflow-hidden text-sm font-mono bg-slate-950">
        <div class="grid grid-cols-3 bg-slate-900 text-xs font-bold text-slate-300 py-2 px-3 border-b border-slate-700 font-sans">
          <span>매도잔량</span>
          <span class="text-center">호가(원)</span>
          <span class="text-right">매수잔량</span>
        </div>
        <div id="orderBookRows" class="divide-y divide-slate-800"></div>
        <div class="grid grid-cols-3 bg-slate-900 text-sm py-2.5 px-3 border-t-2 border-slate-700 font-bold">
          <span id="obTotalAskQty" class="text-sky-400 tabular font-extrabold">0</span>
          <span class="text-center text-slate-300 font-sans text-xs">총 잔량</span>
          <span id="obTotalBidQty" class="text-right text-red-400 tabular font-extrabold">0</span>
        </div>
      </div>

      <!-- 하단 액션 버튼 (공식 인텐트 및 공식 네이버 링크) -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <a id="obNaverLink" href="#" target="_blank" 
           class="text-center text-xs sm:text-sm py-2.5 rounded-xl bg-slate-800 border border-slate-600 hover:bg-slate-700 text-white font-bold transition">
          네이버페이 증권
        </a>
        <a href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.samsungpop.android.mpop;end" 
           class="text-center text-xs sm:text-sm py-2.5 rounded-xl bg-samsung-500 hover:bg-samsung-600 text-white font-extrabold transition shadow-lg">
          삼성증권 mPOP 주문
        </a>
      </div>
    </div>
  </div>

  <!-- 종목 등록/수정 모달 -->
  <div id="stockModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border-2 border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h3 id="modalTitle" class="text-base font-bold text-white">종목 등록</h3>
        <button onclick="closeModal()" class="text-slate-300 hover:text-white text-lg p-1">✕</button>
      </div>

      <input type="hidden" id="editStockId">

      <div class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block text-slate-300 font-bold mb-1">종목명 *</label>
          <input type="text" id="formName" placeholder="예: 삼성중공업" 
                 class="w-full bg-slate-800 border-2 border-slate-600 rounded-lg p-2.5 text-white font-semibold focus:outline-none focus:border-samsung-500">
        </div>
        <div>
          <label class="block text-slate-300 font-bold mb-1">종목코드 (6자리) *</label>
          <input type="text" id="formCode" placeholder="예: 010140" maxlength="6"
                 class="w-full bg-slate-800 border-2 border-slate-600 rounded-lg p-2.5 font-mono text-white font-bold focus:outline-none focus:border-samsung-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-300 font-bold mb-1">매수가 (원)</label>
            <input type="number" id="formBuyPrice" placeholder="0" 
                   class="w-full bg-slate-800 border-2 border-slate-600 rounded-lg p-2.5 font-mono text-white font-bold focus:outline-none focus:border-samsung-500">
          </div>
          <div>
            <label class="block text-slate-300 font-bold mb-1">보유수량 (주)</label>
            <input type="number" id="formQuantity" placeholder="0" 
                   class="w-full bg-slate-800 border-2 border-slate-600 rounded-lg p-2.5 font-mono text-white font-bold focus:outline-none focus:border-samsung-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-300 font-bold mb-1">현재가 (원)</label>
            <input type="number" id="formCurrentPrice" placeholder="0" 
                   class="w-full bg-slate-800 border-2 border-slate-600 rounded-lg p-2.5 font-mono text-white font-bold focus:outline-none focus:border-samsung-500">
          </div>
          <div>
            <label class="block text-slate-300 font-bold mb-1">목표가 (원)</label>
            <input type="number" id="formTargetPrice" placeholder="0" 
                   class="w-full bg-slate-800 border-2 border-slate-600 rounded-lg p-2.5 font-mono text-white font-bold focus:outline-none focus:border-samsung-500">
          </div>
        </div>
        <div>
          <label class="block text-slate-300 font-bold mb-1">투자 메모</label>
          <input type="text" id="formMemo" placeholder="매매 전략 및 대응 계획" 
                 class="w-full bg-slate-800 border-2 border-slate-600 rounded-lg p-2.5 text-white font-medium focus:outline-none focus:border-samsung-500">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-slate-700">
        <button onclick="closeModal()" class="px-4 py-2 text-sm font-bold rounded-lg text-slate-300 hover:bg-slate-800">취소</button>
        <button onclick="saveStock()" class="px-5 py-2 text-sm font-bold rounded-lg bg-samsung-500 hover:bg-samsung-600 text-white shadow-md">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    const BUY_COMMISSION_RATE = 0.00015;
    const SELL_COMMISSION_RATE = 0.00015;
    const TAX_RATE = 0.0018;

    let currentMarketMode = 'TOTAL';
    let currentActiveStock = null;
    let isLightMode = false;

    // 공식 안드로이드 mPOP 런처 인텐트 주소
    const SAMSUNG_MPOP_INTENT = "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.samsungpop.android.mpop;end";

    const INITIAL_STOCKS = [
      { id: '010140', name: '삼성중공업', code: '010140', buyPrice: 11000, currentPrice: 11850, quantity: 100, targetPrice: 15000, memo: '조선 수주 호황 및 실적 턴어라운드' },
      { id: '141080', name: '리가켐바이오', code: '141080', buyPrice: 115000, currentPrice: 122000, quantity: 20, targetPrice: 160000, memo: '글로벌 빅파마 ADC 기술수출 모멘텀' },
      { id: '032640', name: 'LG유플러스', code: '032640', buyPrice: 9800, currentPrice: 9950, quantity: 150, targetPrice: 12000, memo: '고배당 매력 및 B2B AI 사업 확장' },
      { id: '030200', name: 'KT', code: '030200', buyPrice: 41000, currentPrice: 42300, quantity: 50, targetPrice: 50000, memo: '안정적 실적 및 AICT 신성장 동력' },
      { id: '084110', name: '휴온스글로벌', code: '084110', buyPrice: 32000, currentPrice: 31200, quantity: 40, targetPrice: 45000, memo: '에스테틱 수출 성장 및 저평가 밸류' }
    ];

    let stocks = [];

    function toggleTheme() {
      isLightMode = !isLightMode;
      const body = document.body;
      const btn = document.getElementById('themeBtn');

      if (isLightMode) {
        body.classList.remove('bg-slate-950', 'text-slate-100');
        body.classList.add('bg-slate-100', 'text-slate-900');
        btn.innerText = '🌙 어둡게';
        btn.className = 'text-xs font-bold px-2.5 py-2 rounded-xl bg-slate-200 border border-slate-400 text-slate-800 hover:bg-slate-300 transition';
      } else {
        body.classList.remove('bg-slate-100', 'text-slate-900');
        body.classList.add('bg-slate-950', 'text-slate-100');
        btn.innerText = '☀️ 밝게';
        btn.className = 'text-xs font-bold px-2.5 py-2 rounded-xl bg-slate-800 border border-slate-600 text-amber-300 hover:bg-slate-700 transition';
      }
      renderStocks();
    }

    function setMarketMode(mode) {
      currentMarketMode = mode;
      ['TOTAL', 'KRX', 'NXT'].forEach(m => {
        const btn = document.getElementById('tabMode' + m);
        if (m === mode) {
          btn.className = 'py-2.5 rounded-lg text-center transition bg-samsung-500 text-white font-bold shadow-md';
        } else {
          btn.className = 'py-2.5 rounded-lg text-center transition text-slate-300 hover:text-white font-bold';
        }
      });

      const badgeHeader = document.getElementById('marketBadgeHeader');
      if (mode === 'TOTAL') badgeHeader.innerText = 'SOR 통합';
      else if (mode === 'KRX') badgeHeader.innerText = 'KRX 전용';
      else badgeHeader.innerText = 'NXT 전용';

      updateMarketSession();
      renderStocks();
    }

    function updateMarketSession() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const timeNum = hours * 100 + minutes;

      document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];

      const dot = document.getElementById('marketStatusDot');
      const text = document.getElementById('marketStatusText');

      if (currentMarketMode === 'KRX') {
        if (timeNum >= 830 && timeNum < 900) {
          dot.className = 'w-3 h-3 rounded-full bg-amber-400 animate-pulse';
          text.innerHTML = '<span class="text-amber-300">KRX 시초가 동시호가</span> (08:30~09:00)';
        } else if (timeNum >= 900 && timeNum < 1520) {
          dot.className = 'w-3 h-3 rounded-full bg-emerald-400 animate-pulse';
          text.innerHTML = '<span class="text-emerald-300">KRX 정규장 거래 중</span> (09:00~15:20)';
        } else if (timeNum >= 1520 && timeNum < 1530) {
          dot.className = 'w-3 h-3 rounded-full bg-amber-400 animate-pulse';
          text.innerHTML = '<span class="text-amber-300">KRX 종가 동시호가</span> (15:20~15:30)';
        } else {
          dot.className = 'w-3 h-3 rounded-full bg-slate-500';
          text.innerHTML = '<span class="text-slate-300">KRX 정규시장 마감</span>';
        }
      } else if (currentMarketMode === 'NXT') {
        if (timeNum >= 800 && timeNum < 850) {
          dot.className = 'w-3 h-3 rounded-full bg-cyan-400 animate-pulse';
          text.innerHTML = '<span class="text-cyan-300">NXT 프리마켓 거래 중</span> (08:00~08:50)';
        } else if (timeNum >= 900 && timeNum < 1520) {
          dot.className = 'w-3 h-3 rounded-full bg-emerald-400 animate-pulse';
          text.innerHTML = '<span class="text-emerald-300">NXT 메인마켓 거래 중</span> (09:00~15:20)';
        } else if (timeNum >= 1530 && timeNum < 2000) {
          dot.className = 'w-3 h-3 rounded-full bg-purple-400 animate-pulse';
          text.innerHTML = '<span class="text-purple-300">NXT 애프터마켓 거래 중</span> (15:30~20:00)';
        } else {
          dot.className = 'w-3 h-3 rounded-full bg-slate-500';
          text.innerHTML = '<span class="text-slate-300">NXT 12시간 장 마감</span> (익일 08시 오픈)';
        }
      } else {
        if (timeNum >= 800 && timeNum < 850) {
          dot.className = 'w-3 h-3 rounded-full bg-cyan-400 animate-pulse';
          text.innerHTML = '<span class="text-cyan-300 font-bold">NXT 프리마켓 실시간 체결 중</span>';
        } else if (timeNum >= 850 && timeNum < 900) {
          dot.className = 'w-3 h-3 rounded-full bg-amber-400 animate-pulse';
          text.innerHTML = '<span class="text-amber-300 font-bold">KRX 시초가 동시호가 준비</span>';
        } else if (timeNum >= 900 && timeNum < 1520) {
          dot.className = 'w-3 h-3 rounded-full bg-emerald-400 animate-pulse';
          text.innerHTML = '<span class="text-emerald-300 font-bold">통합 최선집행 실시간 거래 중</span>';
        } else if (timeNum >= 1520 && timeNum < 1530) {
          dot.className = 'w-3 h-3 rounded-full bg-amber-400 animate-pulse';
          text.innerHTML = '<span class="text-amber-300 font-bold">KRX 종가 동시호가</span>';
        } else if (timeNum >= 1530 && timeNum < 2000) {
          dot.className = 'w-3 h-3 rounded-full bg-purple-400 animate-pulse';
          text.innerHTML = '<span class="text-purple-300 font-bold">NXT 애프터마켓 거래 중 (20시까지)</span>';
        } else {
          dot.className = 'w-3 h-3 rounded-full bg-slate-500';
          text.innerHTML = '<span class="text-slate-300">통합 시장 마감 (익일 08:00 오픈)</span>';
        }
      }
    }

    function getTickSize(price) {
      if (price < 1000) return 1;
      if (price < 5000) return 5;
      if (price < 20000) return 10;
      if (price < 50000) return 50;
      if (price < 200000) return 100;
      if (price < 500000) return 500;
      return 1000;
    }

    function loadStocks() {
      const saved = localStorage.getItem('seiskang_stocks_v7');
      if (saved) {
        stocks = JSON.parse(saved);
      } else {
        stocks = [...INITIAL_STOCKS];
        saveToStorage();
      }
      renderStocks();
    }

    function saveToStorage() {
      localStorage.setItem('seiskang_stocks_v7', JSON.stringify(stocks));
    }

    function resetToDefaults() {
      if (confirm('기본 5개 종목으로 복원하시겠습니까?')) {
        stocks = [...INITIAL_STOCKS];
        saveToStorage();
        renderStocks();
      }
    }

    function renderStocks(filterText = '') {
      const container = document.getElementById('stockList');
      container.innerHTML = '';

      let totalBuy = 0;
      let totalEval = 0;
      let totalNetProfit = 0;
      let totalEstimatedFees = 0;

      const filtered = stocks.filter(s => 
        s.name.toLowerCase().includes(filterText.toLowerCase()) || 
        s.code.includes(filterText)
      );

      filtered.forEach(stock => {
        const buyTotal = stock.buyPrice * stock.quantity;
        const evalTotal = stock.currentPrice * stock.quantity;

        const buyFee = Math.floor(buyTotal * BUY_COMMISSION_RATE);
        const sellFee = Math.floor(evalTotal * SELL_COMMISSION_RATE);
        const sellTax = Math.floor(evalTotal * TAX_RATE);
        const totalFee = buyFee + sellFee + sellTax;

        const grossDiff = evalTotal - buyTotal;
        const netDiff = grossDiff - totalFee;
        const netRate = buyTotal > 0 ? (netDiff / buyTotal) * 100 : 0;
        const isUp = netDiff > 0;
        const isFlat = netDiff === 0;

        totalBuy += buyTotal;
        totalEval += evalTotal;
        totalNetProfit += netDiff;
        totalEstimatedFees += totalFee;

        let targetProgress = 0;
        if (stock.targetPrice > stock.buyPrice) {
          targetProgress = Math.min(Math.max(((stock.currentPrice - stock.buyPrice) / (stock.targetPrice - stock.buyPrice)) * 100, 0), 100);
        }

        const card = document.createElement('div');
        const cardBg = isLightMode ? 'bg-white border-slate-300 text-slate-900 shadow-md' : 'bg-slate-900 border-slate-700 text-white shadow-lg';
        card.className = `${cardBg} border-2 rounded-2xl p-4 sm:p-5 transition space-y-3`;

        const upColor = isLightMode ? 'text-red-600' : 'text-red-400';
        const downColor = isLightMode ? 'text-blue-600' : 'text-sky-400';
        const flatColor = isLightMode ? 'text-slate-600' : 'text-slate-300';
        const pnlColorClass = isFlat ? flatColor : isUp ? upColor : downColor;

        const naverOfficialUrl = `https://m.stock.naver.com/domestic/stock/${stock.code}/total`;

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-lg sm:text-xl font-extrabold tracking-tight">${stock.name}</span>
                <span class="font-mono text-xs px-2 py-0.5 rounded font-bold ${isLightMode ? 'bg-slate-200 text-slate-800' : 'bg-slate-800 text-white border border-slate-600'}">${stock.code}</span>
                <span class="text-xs px-1.5 py-0.5 rounded font-bold bg-samsung-500 text-white font-mono">
                  ${currentMarketMode === 'TOTAL' ? 'SOR' : currentMarketMode}
                </span>
              </div>
              <p class="text-xs font-semibold text-slate-400 mt-1">${stock.memo || '전략 메모 없음'}</p>
            </div>
            <div class="text-right">
              <div class="font-mono text-xl sm:text-2xl font-extrabold tabular ${pnlColorClass}">
                ${Number(stock.currentPrice).toLocaleString()}원
              </div>
              <div class="font-mono text-xs sm:text-sm font-bold ${pnlColorClass}">
                ${isUp ? '▲ +' : isFlat ? '-' : '▼ '}${netRate.toFixed(2)}% (순익)
              </div>
            </div>
          </div>

          <div class="${isLightMode ? 'bg-slate-50 border-slate-300' : 'bg-slate-950 border-slate-700'} border-2 rounded-xl p-3 grid grid-cols-2 gap-2 text-xs sm:text-sm">
            <div>
              <span class="text-xs font-bold text-slate-400 block">제비용 제외 순 실현손익</span>
              <span class="font-mono text-base sm:text-lg font-extrabold tabular ${pnlColorClass}">
                ${netDiff > 0 ? '+' : ''}${Math.round(netDiff).toLocaleString()}원
              </span>
            </div>
            <div class="text-right">
              <span class="text-xs font-bold text-slate-400 block">예상 제비용(0.21%)</span>
              <span class="font-mono text-amber-400 font-bold tabular text-sm sm:text-base">-${totalFee.toLocaleString()}원</span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 text-xs sm:text-sm font-semibold pt-1">
            <div class="${isLightMode ? 'bg-slate-100' : 'bg-slate-950/70'} p-2 rounded-lg border ${isLightMode ? 'border-slate-200' : 'border-slate-800'}">
              <span class="text-slate-400 block text-[11px]">매수단가</span>
              <span class="font-mono font-bold tabular">${Number(stock.buyPrice).toLocaleString()}원</span>
            </div>
            <div class="${isLightMode ? 'bg-slate-100' : 'bg-slate-950/70'} p-2 rounded-lg border ${isLightMode ? 'border-slate-200' : 'border-slate-800'} text-center">
              <span class="text-slate-400 block text-[11px]">보유수량</span>
              <span class="font-mono font-bold tabular">${stock.quantity}주</span>
            </div>
            <div class="${isLightMode ? 'bg-slate-100' : 'bg-slate-950/70'} p-2 rounded-lg border ${isLightMode ? 'border-slate-200' : 'border-slate-800'} text-right">
              <span class="text-slate-400 block text-[11px]">평가금액</span>
              <span class="font-mono font-bold tabular">${Math.round(evalTotal).toLocaleString()}원</span>
            </div>
          </div>

          ${stock.targetPrice > 0 ? `
          <div class="pt-1">
            <div class="flex justify-between text-xs font-bold mb-1">
              <span class="text-slate-300">목표가 ${Number(stock.targetPrice).toLocaleString()}원</span>
              <span class="text-amber-400">달성률 ${targetProgress.toFixed(1)}%</span>
            </div>
            <div class="w-full ${isLightMode ? 'bg-slate-200' : 'bg-slate-800'} h-2.5 rounded-full overflow-hidden">
              <div class="bg-samsung-500 h-full rounded-full transition-all duration-500" style="width: ${targetProgress}%"></div>
            </div>
          </div>
          ` : ''}

          <div class="flex items-center justify-between pt-3 border-t ${isLightMode ? 'border-slate-200' : 'border-slate-700/80'}">
            <div class="flex items-center space-x-2">
              <button onclick="openOrderBook('${stock.id}')" 
                      class="text-xs sm:text-sm font-extrabold px-3 py-2 rounded-xl bg-samsung-500 text-white shadow hover:bg-samsung-600 transition flex items-center gap-1">
                📊 10호가
              </button>
              <a href="${naverOfficialUrl}" target="_blank" 
                 class="text-xs sm:text-sm font-bold px-3 py-2 rounded-xl ${isLightMode ? 'bg-slate-200 text-slate-800' : 'bg-slate-800 text-white border border-slate-600'} hover:bg-slate-700 transition">
                네이버페이 증권
              </a>
              <!-- 정확한 공식 mPOP 패키지 인텐트 -->
              <a href="${SAMSUNG_MPOP_INTENT}" 
                 class="text-xs sm:text-sm font-bold px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 transition">
                mPOP주문
              </a>
            </div>
            <div class="flex items-center space-x-3 text-xs sm:text-sm font-bold">
              <button onclick="editStock('${stock.id}')" class="text-slate-300 hover:text-white underline">수정</button>
              <button onclick="deleteStock('${stock.id}')" class="text-red-400 hover:text-red-300 underline">삭제</button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      document.getElementById('totalStockCount').innerText = `${stocks.length}개 종목`;
      document.getElementById('totalInvestment').innerText = `${Math.round(totalBuy).toLocaleString()} 원`;
      document.getElementById('totalValuation').innerText = `${Math.round(totalEval).toLocaleString()} 원`;
      document.getElementById('totalFees').innerText = `-${Math.round(totalEstimatedFees).toLocaleString()} 원`;

      const netRateTotal = totalBuy > 0 ? (totalNetProfit / totalBuy) * 100 : 0;
      const netSign = totalNetProfit > 0 ? '+' : '';
      const netPnLElem = document.getElementById('totalNetPnL');
      const netRateElem = document.getElementById('totalNetRate');

      const upColor = isLightMode ? 'text-red-600' : 'text-red-400';
      const downColor = isLightMode ? 'text-blue-600' : 'text-sky-400';
      const flatColor = isLightMode ? 'text-slate-700' : 'text-slate-200';

      netPnLElem.innerText = `${netSign}${Math.round(totalNetProfit).toLocaleString()} 원`;
      netPnLElem.className = `font-mono text-xl sm:text-2xl font-extrabold tabular ${totalNetProfit > 0 ? upColor : totalNetProfit < 0 ? downColor : flatColor}`;

      netRateElem.innerText = `${netSign}${netRateTotal.toFixed(2)}%`;
      netRateElem.className = `font-mono text-base sm:text-lg font-extrabold tabular ${totalNetProfit > 0 ? upColor : totalNetProfit < 0 ? downColor : flatColor}`;
    }

    function openOrderBook(stockId) {
      currentActiveStock = stocks.find(s => s.id === stockId);
      if (!currentActiveStock) return;

      document.getElementById('obStockName').innerText = currentActiveStock.name;
      document.getElementById('obStockCode').innerText = currentActiveStock.code;
      document.getElementById('obNaverLink').href = `https://m.stock.naver.com/domestic/stock/${currentActiveStock.code}/total`;

      renderOrderBookRows(currentMarketMode);
      document.getElementById('orderBookModal').classList.remove('hidden');
    }

    function renderOrderBookRows(mode) {
      ['TOTAL', 'KRX', 'NXT'].forEach(m => {
        const btn = document.getElementById('obTab' + m);
        if (m === mode) {
          btn.className = 'py-2 rounded-lg text-center bg-samsung-500 text-white font-bold shadow';
        } else {
          btn.className = 'py-2 rounded-lg text-center text-slate-300 hover:text-white font-bold';
        }
      });

      if (!currentActiveStock) return;

      const tick = getTickSize(currentActiveStock.currentPrice);
      const rowsContainer = document.getElementById('orderBookRows');
      rowsContainer.innerHTML = '';

      let totalAskQty = 0;
      let totalBidQty = 0;
      const weight = mode === 'TOTAL' ? 1.0 : mode === 'KRX' ? 0.65 : 0.35;

      const askList = [];
      for (let i = 10; i >= 1; i--) {
        const p = currentActiveStock.currentPrice + (i * tick);
        const qty = Math.floor((((Math.sin(p) + 1.5) * 450) + (11 - i) * 150) * weight);
        totalAskQty += qty;
        askList.push({ price: p, qty, type: 'ask' });
      }

      const bidList = [];
      for (let i = 0; i < 10; i++) {
        const p = currentActiveStock.currentPrice - (i * tick);
        const qty = Math.floor((((Math.cos(p) + 1.5) * 420) + (10 - i) * 160) * weight);
        totalBidQty += qty;
        bidList.push({ price: p, qty, type: 'bid', isCurrent: i === 0 });
      }

      const maxQty = Math.max(...askList.map(a => a.qty), ...bidList.map(b => b.qty));

      askList.forEach(item => {
        const barWidth = Math.round((item.qty / maxQty) * 100);
        const row = document.createElement('div');
        row.className = 'grid grid-cols-3 py-1.5 px-3 items-center bg-blue-950/40 border-b border-slate-800/80';
        row.innerHTML = `
          <div class="relative flex items-center">
            <div class="absolute left-0 h-5 bg-sky-500/30 rounded" style="width: ${barWidth}%"></div>
            <span class="relative z-10 text-xs sm:text-sm text-sky-300 font-bold tabular pl-1">${item.qty.toLocaleString()}</span>
          </div>
          <div class="text-center font-extrabold text-sky-400 text-sm sm:text-base">${item.price.toLocaleString()}</div>
          <div></div>
        `;
        rowsContainer.appendChild(row);
      });

      bidList.forEach(item => {
        const barWidth = Math.round((item.qty / maxQty) * 100);
        const row = document.createElement('div');
        row.className = `grid grid-cols-3 py-1.5 px-3 items-center ${item.isCurrent ? 'bg-red-950/60 ring-2 ring-red-500' : 'bg-red-950/30'} border-b border-slate-800/80`;
        row.innerHTML = `
          <div></div>
          <div class="text-center font-extrabold text-red-400 text-sm sm:text-base flex items-center justify-center gap-1">
            ${item.price.toLocaleString()}
            ${item.isCurrent ? '<span class="text-[10px] bg-red-600 text-white px-1.5 py-0.5 rounded font-bold">현재</span>' : ''}
          </div>
          <div class="relative flex items-center justify-end">
            <div class="absolute right-0 h-5 bg-red-500/30 rounded" style="width: ${barWidth}%"></div>
            <span class="relative z-10 text-xs sm:text-sm text-red-300 font-bold tabular pr-1">${item.qty.toLocaleString()}</span>
          </div>
        `;
        rowsContainer.appendChild(row);
      });

      document.getElementById('obTotalAskQty').innerText = totalAskQty.toLocaleString();
      document.getElementById('obTotalBidQty').innerText = totalBidQty.toLocaleString();
    }

    function closeOrderBook() {
      document.getElementById('orderBookModal').classList.add('hidden');
    }

    function openAddModal() {
      document.getElementById('editStockId').value = '';
      document.getElementById('modalTitle').innerText = '신규 관심종목 등록';
      document.getElementById('formName').value = '';
      document.getElementById('formCode').value = '';
      document.getElementById('formBuyPrice').value = '';
      document.getElementById('formQuantity').value = '';
      document.getElementById('formCurrentPrice').value = '';
      document.getElementById('formTargetPrice').value = '';
      document.getElementById('formMemo').value = '';
      document.getElementById('stockModal').classList.remove('hidden');
    }

    function editStock(id) {
      const item = stocks.find(s => s.id === id);
      if (!item) return;

      document.getElementById('editStockId').value = item.id;
      document.getElementById('modalTitle').innerText = '종목 정보 수정';
      document.getElementById('formName').value = item.name;
      document.getElementById('formCode').value = item.code;
      document.getElementById('formBuyPrice').value = item.buyPrice;
      document.getElementById('formQuantity').value = item.quantity;
      document.getElementById('formCurrentPrice').value = item.currentPrice;
      document.getElementById('formTargetPrice').value = item.targetPrice;
      document.getElementById('formMemo').value = item.memo || '';
      document.getElementById('stockModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('stockModal').classList.add('hidden');
    }

    function saveStock() {
      const id = document.getElementById('editStockId').value;
      const name = document.getElementById('formName').value.trim();
      const code = document.getElementById('formCode').value.trim();
      const buyPrice = Number(document.getElementById('formBuyPrice').value) || 0;
      const quantity = Number(document.getElementById('formQuantity').value) || 0;
      const currentPrice = Number(document.getElementById('formCurrentPrice').value) || buyPrice;
      const targetPrice = Number(document.getElementById('formTargetPrice').value) || 0;
      const memo = document.getElementById('formMemo').value.trim();

      if (!name || !code) {
        alert('종목명과 종목코드는 필수 항목입니다.');
        return;
      }

      if (id) {
        const index = stocks.findIndex(s => s.id === id);
        if (index !== -1) {
          stocks[index] = { ...stocks[index], name, code, buyPrice, quantity, currentPrice, targetPrice, memo };
        }
      } else {
        stocks.unshift({
          id: Date.now().toString(),
          name, code, buyPrice, quantity, currentPrice, targetPrice, memo
        });
      }

      saveToStorage();
      renderStocks();
      closeModal();
    }

    function deleteStock(id) {
      const item = stocks.find(s => s.id === id);
      if (!item) return;
      if (confirm(`'${item.name}' 종목을 삭제하시겠습니까?`)) {
        stocks = stocks.filter(s => s.id !== id);
        saveToStorage();
        renderStocks();
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderStocks(e.target.value);
    });

    setInterval(updateMarketSession, 1000);

    window.addEventListener('DOMContentLoaded', () => {
      loadStocks();
      updateMarketSession();
    });
  </script>
</body>
</html>
