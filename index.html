<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세이스강 클래스 매니저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">

<style>
/* ===== tokens: base palette (from 푸른느낌 design system) ===== */
:root {
  --green-50:  #f0f7f3; --green-100: #d9ece2; --green-200: #a7d8c4; --green-300: #76c0a4; --green-400: #4aa183;
  --green-500: #1f6f5c; --green-600: #1a5d4d; --green-700: #15493d; --green-800: #0e3b30; --green-900: #082620;
  --neutral-0: #ffffff; --neutral-50: #f7f9f8; --neutral-100: #eef2f0; --neutral-200: #dfe5e2; --neutral-300: #c5cecb;
  --neutral-400: #9aa6a2; --neutral-500: #6f7c78; --neutral-600: #515c59; --neutral-700: #3a4340; --neutral-800: #262d2b; --neutral-900: #161b1a;
  --clay-500: #c4684a; --amber-400: #e0a64b; --amber-500: #cf8a2b; --sky-400: #5aa9d6; --sky-500: #2f7db8; --moss-500: #7a8b3c;
  --success-500: var(--green-500); --success-50: var(--green-50);
  --warning-500: var(--amber-500); --warning-50: #fcf4e4;
  --danger-500: #c4503a; --danger-50: #fbedea;
  --info-500: var(--sky-500); --info-50: #e9f3fa;

  --text-strong: var(--neutral-900); --text-body: var(--neutral-700); --text-muted: var(--neutral-500); --text-subtle: var(--neutral-400);
  --text-on-brand: #ffffff;
  --surface-page: var(--neutral-50); --surface-card: var(--neutral-0); --surface-sunken: var(--neutral-100); --surface-inverse: var(--green-900);
  --surface-brand-subtle: var(--green-50);
  --border-subtle: var(--neutral-200); --border-default: var(--neutral-300); --border-strong: var(--neutral-400); --border-focus: var(--green-400);
  --action-primary: var(--green-500); --action-primary-hover: var(--green-600); --action-primary-active: var(--green-700); --action-ghost-hover: var(--green-50);
  --ring: 0 0 0 3px color-mix(in srgb, var(--green-400) 45%, transparent);

  /* ---- Samsung blue reskin (overrides brand + neutrals + success/info) ---- */
  --green-50: #eef3fb; --green-100: #dae4f6; --green-200: #b3c6ec; --green-300: #7e9bdc; --green-400: #4767c2;
  --green-500: #1428a0; --green-600: #101f80; --green-700: #0c1863; --green-800: #081046; --green-900: #060c2b;
  --neutral-50: #f6f8fb; --neutral-100: #eceff5; --neutral-200: #dde2ea; --neutral-300: #c2c9d6; --neutral-400: #98a1b2;
  --neutral-500: #6b7484; --neutral-600: #4d5563; --neutral-700: #374050; --neutral-800: #232a36; --neutral-900: #131822;
  --success-500: #1d7a4f; --success-50: #eaf5ef; --info-500: #2f7db8; --info-50: #eaf3fa; --sky-500: #2f7db8;
  --ring: 0 0 0 3px color-mix(in srgb, var(--green-400) 40%, transparent);

  /* ---- typography ---- */
  --font-sans: "Mulish", "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600; --weight-bold: 700; --weight-extrabold: 800;
  --text-2xs: 0.6875rem; --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.125rem;
  --text-xl: 1.375rem; --text-2xl: 1.75rem; --text-3xl: 2.25rem;
  --leading-tight: 1.12; --leading-snug: 1.3; --leading-normal: 1.55; --leading-relaxed: 1.7;
  --tracking-wide: 0.04em;
  --type-caption: var(--weight-medium) var(--text-xs)/1.4 var(--font-sans);
  --type-body: var(--weight-regular) var(--text-md)/var(--leading-normal) var(--font-sans);

  /* ---- spacing ---- */
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem;
  --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;

  /* ---- effects ---- */
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-pill: 999px;
  --shadow-sm: 0 2px 6px rgba(14, 59, 48, 0.07);
  --shadow-md: 0 6px 18px rgba(14, 59, 48, 0.09);
  --shadow-lg: 0 16px 40px rgba(14, 59, 48, 0.12);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --duration-base: 200ms;
  --transition-base: all var(--duration-base) var(--ease-out);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: var(--type-body);
  color: var(--text-body);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
::selection { background: var(--green-200); color: var(--green-900); }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }
button { font-family: var(--font-sans); }
.tabular { font-variant-numeric: tabular-nums; }
.eyebrow { font: var(--type-caption); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== shell ===== */
#app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
#app.auth-mode { display: block; }
.sidebar {
  display: flex; flex-direction: column; gap: var(--space-8);
  background: var(--green-900); padding: var(--space-6) var(--space-4);
}
.brand-row { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-2); }
.brand-mark {
  display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border-radius: 9px; background: var(--green-500); color: #fff; font: var(--weight-extrabold) 13px/1 var(--font-sans); letter-spacing: -0.02em; flex: none;
}
.brand-name { font: var(--weight-bold) var(--text-sm)/1.1 var(--font-sans); color: #fff; letter-spacing: -0.02em; }
.brand-sub { font: var(--weight-medium) 10px/1 var(--font-sans); color: var(--green-300); letter-spacing: 0.08em; text-transform: uppercase; }

.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav-item {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  min-height: 44px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  cursor: pointer; transition: var(--transition-base); background: transparent; border: none; text-align: left; width: 100%;
}
.side-nav-item:hover { background: rgba(255,255,255,.07); }
.side-nav-item.is-active { background: rgba(255,255,255,.12); }
.side-nav-item .ko { display: block; font: var(--weight-semibold) var(--text-sm)/1.2 var(--font-sans); color: rgba(255,255,255,.72); white-space: nowrap; }
.side-nav-item.is-active .ko { color: #fff; }
.side-nav-item .en { display: block; font: var(--weight-regular) 10px/1 var(--font-sans); color: rgba(255,255,255,.38); white-space: nowrap; }
.side-nav-item.is-active .en { color: var(--green-200); }
.side-nav-item .count { flex: none; font: var(--weight-semibold) 11px/1 var(--font-sans); color: rgba(255,255,255,.38); }
.side-nav-item.is-active .count { color: var(--green-200); }
.side-nav-item.is-soon .ko::after { content: " · 준비중"; font-weight: var(--weight-regular); color: rgba(255,255,255,.4); }

.package-box {
  margin-top: auto; padding: var(--space-4); border-radius: var(--radius-lg); background: rgba(255,255,255,.06);
  display: flex; flex-direction: column; gap: var(--space-2);
}
.package-box .lbl { font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--green-200); letter-spacing: 0.06em; text-transform: uppercase; }
.package-box .big { font: var(--weight-bold) var(--text-lg)/1.2 var(--font-sans); color: #fff; }
.package-box .fine { font: var(--weight-regular) var(--text-xs)/1.5 var(--font-sans); color: var(--green-300); }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-3) var(--space-8); min-height: 64px; background: var(--surface-card); border-bottom: 1px solid var(--border-subtle);
}
.crumbs { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.crumb-root { font: var(--weight-regular) var(--text-sm)/1 var(--font-sans); color: var(--text-muted); white-space: nowrap; }
.crumb-sep { color: var(--text-subtle); }
.crumb-leaf { font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: var(--space-4); flex: none; }
.who { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.who .name { font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-strong); }
.who .clock { font: var(--weight-regular) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); }

.mobile-nav { display: none; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--surface-card); border-bottom: 1px solid var(--border-subtle); overflow-x: auto; }
.chip {
  display: inline-flex; flex: none; align-items: center; gap: var(--space-2); height: 34px; padding: 0 var(--space-4);
  border-radius: var(--radius-pill); cursor: pointer; font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans);
  border: 1px solid var(--border-subtle); background: var(--surface-card); color: var(--text-body); white-space: nowrap;
}
.chip.is-active { border-color: var(--green-500); background: var(--green-500); color: #fff; }
.chip.is-soon { border-style: dashed; color: var(--text-muted); }

.view { flex: 1; min-width: 0; padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }

/* ===== search input ===== */
.search-wrap { position: relative; display: inline-flex; align-items: center; }
.search-wrap .icon { position: absolute; left: 12px; color: var(--text-subtle); font-size: 14px; pointer-events: none; }
.search-input {
  width: 240px; height: 40px; padding: 0 var(--space-3) 0 34px; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); font: var(--weight-regular) var(--text-sm)/1 var(--font-sans); background: var(--surface-card); color: var(--text-body);
}
.search-input:focus { border-color: var(--border-focus); }

/* ===== buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 var(--space-5);
  border-radius: var(--radius-md); font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); cursor: pointer;
  border: 1px solid transparent; transition: var(--transition-base); white-space: nowrap;
}
.btn-primary { background: var(--action-primary); color: #fff; }
.btn-primary:hover { background: var(--action-primary-hover); }
.btn-secondary { background: var(--surface-card); border-color: var(--border-default); color: var(--text-body); }
.btn-secondary:hover { border-color: var(--border-strong); }
.btn-ghost { background: transparent; color: var(--text-body); }
.btn-ghost:hover { background: var(--action-ghost-hover); }
.btn.full { width: 100%; }

/* ===== card / stat / badge ===== */
.card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.card--pad { padding: var(--space-6); }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border-subtle); }
.card-head .title { font: var(--weight-bold) var(--text-md)/1 var(--font-sans); color: var(--text-strong); }
.card-head .note { font: var(--weight-medium) var(--text-sm)/1 var(--font-sans); color: var(--text-muted); }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
.stat-card { display: flex; flex-direction: column; gap: var(--space-2); justify-content: center; min-height: 132px; padding: var(--space-5) var(--space-6); }
.stat-card .label { font: var(--type-caption); color: var(--text-muted); }
.stat-card .value { font: var(--weight-extrabold) var(--text-2xl)/1.1 var(--font-sans); color: var(--text-strong); }
.stat-card .value .unit { font: var(--weight-semibold) var(--text-md)/1 var(--font-sans); color: var(--text-muted); margin-left: 4px; }
.stat-card .caption { font: var(--weight-regular) var(--text-xs)/1.4 var(--font-sans); color: var(--text-muted); }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: var(--radius-pill); font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); white-space: nowrap; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.badge.tone-success { background: var(--success-50); color: var(--success-500); } .badge.tone-success .dot { background: var(--success-500); }
.badge.tone-warning { background: var(--warning-50); color: var(--warning-500); } .badge.tone-warning .dot { background: var(--warning-500); }
.badge.tone-danger { background: var(--danger-50); color: var(--danger-500); } .badge.tone-danger .dot { background: var(--danger-500); }
.badge.tone-info { background: var(--info-50); color: var(--info-500); } .badge.tone-info .dot { background: var(--info-500); }
.badge.tone-brand { background: var(--surface-brand-subtle); color: var(--green-600); } .badge.tone-brand .dot { background: var(--green-500); }
.badge.tone-neutral { background: var(--neutral-100); color: var(--text-muted); } .badge.tone-neutral .dot { background: var(--text-muted); }

/* ===== filter chips ===== */
.filter-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.filter-chip {
  display: inline-flex; flex: none; align-items: center; height: 32px; padding: 0 var(--space-4);
  border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans);
  border: 1px solid var(--border-subtle); background: var(--surface-card); color: var(--text-body);
}
.filter-chip.is-active { border-color: var(--green-500); background: var(--green-500); color: #fff; }

/* ===== progress ===== */
.bar-track { height: 6px; border-radius: 999px; background: var(--neutral-100); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }

.ring-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); text-align: center; }
.ring-wrap .card-head.solo { align-self: flex-start; border-bottom: none; padding: 0; }

/* ===== table ===== */
.table-head, .table-row { display: grid; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); }
.table-head { background: var(--neutral-50); border-bottom: 1px solid var(--border-subtle); font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
.table-row { border-bottom: 1px solid var(--neutral-100); cursor: pointer; transition: var(--transition-base); }
.table-row:hover { background: var(--green-50); }
.table-row:last-child, .table-body > *:last-child .table-row { border-bottom: none; }
.grid-students { grid-template-columns: 1.6fr 1.3fr 0.8fr 1.2fr 1.1fr 1fr; }
.grid-payments { grid-template-columns: 1.5fr 1fr 0.8fr 0.8fr 1.1fr 1.1fr; }
.avatar-init { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--green-100); color: var(--green-700); font: var(--weight-bold) var(--text-xs)/1 var(--font-sans); }

/* ===== lists ===== */
.agenda-row { display: grid; grid-template-columns: 104px 8px 1fr auto; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--neutral-100); cursor: pointer; }
.agenda-row:last-child { border-bottom: none; }
.agenda-row:hover { background: var(--green-50); }
.dot-lg { width: 8px; height: 8px; border-radius: 50%; }

/* ===== alert / toast ===== */
.alert { display: flex; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-radius: var(--radius-md); border: 1px solid; }
.alert.tone-success { background: var(--success-50); border-color: color-mix(in srgb, var(--success-500) 35%, transparent); }
.alert.tone-danger { background: var(--danger-50); border-color: color-mix(in srgb, var(--danger-500) 35%, transparent); }
.alert.tone-info { background: var(--info-50); border-color: color-mix(in srgb, var(--info-500) 35%, transparent); }
.alert .title { font: var(--weight-bold) var(--text-sm)/1.3 var(--font-sans); color: var(--text-strong); }
.alert .body { font: var(--weight-regular) var(--text-sm)/1.5 var(--font-sans); color: var(--text-body); margin-top: 2px; }
.alert .close { margin-left: auto; flex: none; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 16px; line-height: 1; }

.toast-wrap { position: fixed; z-index: 70; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); animation: toastIn 220ms var(--ease-out) both; }
.toast-wrap .card { box-shadow: var(--shadow-lg); }

/* ===== modal ===== */
.modal-backdrop { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: var(--space-6); background: rgba(6,12,43,.42); animation: fadeIn 160ms var(--ease-out) both; }
.modal-box { width: 100%; max-width: 520px; animation: rise 200ms var(--ease-out) both; }
.modal-rows { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); background: var(--neutral-50); border-radius: var(--radius-md); }
.modal-rows .r { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); }
.modal-rows .r .k { font: var(--weight-regular) var(--text-sm)/1.4 var(--font-sans); color: var(--text-muted); }
.modal-rows .r .v { flex: none; font: var(--weight-semibold) var(--text-sm)/1.4 var(--font-sans); color: var(--text-strong); text-align: right; white-space: nowrap; }

.field-label { display: block; font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: var(--space-2); }
.textarea {
  width: 100%; padding: var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  font: var(--weight-regular) var(--text-sm)/1.5 var(--font-sans); color: var(--text-body); background: var(--surface-card); resize: vertical;
}
.textarea:focus { border-color: var(--border-focus); }
.input {
  width: 100%; height: 40px; padding: 0 var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  font: var(--weight-regular) var(--text-sm)/1 var(--font-sans); color: var(--text-body); background: var(--surface-card);
}
.input:focus { border-color: var(--border-focus); }

/* ===== auth ===== */
.auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); background: var(--surface-page); }
.auth-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: var(--space-5); }
.auth-brand { display: flex; align-items: center; justify-content: center; gap: var(--space-3); }
.auth-tabs { display: flex; gap: var(--space-2); padding: 3px; background: var(--surface-sunken); border-radius: var(--radius-md); }
.auth-tab { flex: 1; text-align: center; padding: var(--space-2); border-radius: var(--radius-sm); cursor: pointer; font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-muted); }
.auth-tab.is-active { background: var(--surface-card); color: var(--text-strong); box-shadow: var(--shadow-sm); }
.auth-error { font: var(--weight-medium) var(--text-sm)/1.4 var(--font-sans); color: var(--danger-500); }
.auth-hint { text-align: center; font: var(--weight-regular) var(--text-xs)/1.4 var(--font-sans); color: var(--text-subtle); }
.dev-box {
  padding: var(--space-4); border-radius: var(--radius-md); background: var(--warning-50);
  border: 1px solid color-mix(in srgb, var(--warning-500) 35%, transparent);
  font: var(--weight-regular) var(--text-xs)/1.6 var(--font-sans); color: var(--text-body); word-break: break-all;
}
.dev-box a { color: var(--info-500); }

/* ===== landing (visitor intro) ===== */
:root {
  --hanji: #faf6ee;
  --hanji-line: #e6dcc8;
  --ink: #10182b;
  --seal: #b3402c;
  --seal-soft: #f7e6e0;
  --gold: #b08a3e;
  --font-serif-kr: "Noto Serif KR", "IBM Plex Sans KR", serif;
}
.landing-page { background: var(--hanji); }
.landing-hero {
  position: relative; overflow: hidden; background: var(--ink);
  padding: var(--space-10) var(--space-6) var(--space-8);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-6); text-align: center;
}
.landing-hero .hero-art { position: absolute; inset: 0; opacity: 0.16; pointer-events: none; }
.landing-hero .hero-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-5); max-width: 560px; }
.landing-photo {
  width: 108px; height: 132px; border-radius: 54px / 66px; flex: none;
  background: linear-gradient(160deg, var(--green-300), var(--green-600));
  display: flex; align-items: center; justify-content: center;
  font: var(--weight-bold) 40px/1 var(--font-serif-kr); color: #fff;
  box-shadow: 0 0 0 4px rgba(255,255,255,0.14), 0 14px 30px -10px rgba(0,0,0,0.55);
}
.landing-hero .eyebrow-light { font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.landing-hero h1 {
  font: var(--weight-bold) var(--text-3xl)/1.25 var(--font-serif-kr); color: #fff; letter-spacing: -0.01em; text-wrap: balance;
}
.landing-hero .hero-sub { color: rgba(255,255,255,0.72); font: var(--weight-regular) var(--text-md)/1.6 var(--font-sans); text-wrap: balance; }
.landing-hero .hero-cta { display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center; margin-top: var(--space-2); }
.landing-hero .btn-hero {
  display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 var(--space-6);
  border-radius: var(--radius-pill); font: var(--weight-bold) var(--text-sm)/1 var(--font-sans); cursor: pointer; border: 1px solid transparent;
  background: var(--seal); color: #fff; transition: var(--transition-base);
}
.landing-hero .btn-hero:hover { background: #9c3624; }
.landing-hero .btn-hero.ghost { background: transparent; border-color: rgba(255,255,255,0.3); color: #fff; }
.landing-hero .btn-hero.ghost:hover { border-color: rgba(255,255,255,0.6); }

.landing-section { max-width: 720px; margin: 0 auto; padding: var(--space-10) var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
.landing-section + .landing-section { border-top: 1px solid var(--hanji-line); }
.landing-head { display: flex; flex-direction: column; gap: var(--space-2); text-align: center; }
.landing-head .eyebrow-seal { font: var(--weight-bold) var(--text-xs)/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--seal); }
.landing-head h2 { font: var(--weight-bold) var(--text-2xl)/1.3 var(--font-serif-kr); color: var(--ink); text-wrap: balance; }

.credential-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); }
.credential-card {
  background: #fff; border: 1px solid var(--hanji-line); border-radius: var(--radius-lg);
  padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2);
  box-shadow: var(--shadow-sm);
}
.credential-card .mark { width: 34px; height: 34px; border-radius: 50%; background: var(--seal-soft); color: var(--seal); display: flex; align-items: center; justify-content: center; font: var(--weight-bold) var(--text-sm)/1 var(--font-serif-kr); flex: none; }
.credential-card .title { font: var(--weight-bold) var(--text-md)/1.35 var(--font-sans); color: var(--text-strong); }
.credential-card .desc { font: var(--weight-regular) var(--text-sm)/1.55 var(--font-sans); color: var(--text-muted); }

.career-line { display: flex; flex-direction: column; gap: var(--space-3); }
.career-row { display: grid; grid-template-columns: 84px 1fr; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--hanji-line); }
.career-row:last-child { border-bottom: none; }
.career-row .age { font: var(--weight-bold) var(--text-sm)/1 var(--font-serif-kr); color: var(--seal); white-space: nowrap; }
.career-row .desc { font: var(--weight-medium) var(--text-sm)/1.5 var(--font-sans); color: var(--text-body); }
.role-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; }
.role-chip {
  display: inline-flex; align-items: center; height: 32px; padding: 0 var(--space-4); border-radius: var(--radius-pill);
  background: #fff; border: 1px solid var(--hanji-line); font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--text-body);
}

.enroll-steps { display: flex; flex-direction: column; gap: var(--space-3); }
.enroll-step { display: grid; grid-template-columns: 30px 1fr; gap: var(--space-4); align-items: flex-start; }
.enroll-step .num {
  width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center;
  font: var(--weight-bold) var(--text-sm)/1 var(--font-serif-kr); flex: none;
}
.enroll-step .title { font: var(--weight-bold) var(--text-sm)/1.4 var(--font-sans); color: var(--text-strong); }
.enroll-step .desc { font: var(--weight-regular) var(--text-sm)/1.55 var(--font-sans); color: var(--text-muted); margin-top: 2px; }

.price-card { background: #fff; border: 1px solid var(--hanji-line); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
.price-head { padding: var(--space-5) var(--space-6); background: var(--ink); color: #fff; display: flex; align-items: baseline; justify-content: space-between; }
.price-head .amount { font: var(--weight-extrabold) var(--text-2xl)/1 var(--font-serif-kr); }
.price-head .unit { font: var(--weight-regular) var(--text-sm)/1 var(--font-sans); color: rgba(255,255,255,0.65); }
.refund-table { width: 100%; border-collapse: collapse; }
.refund-table td { padding: var(--space-4) var(--space-6); font: var(--weight-medium) var(--text-sm)/1.5 var(--font-sans); border-bottom: 1px solid var(--hanji-line); }
.refund-table tr:last-child td { border-bottom: none; }
.refund-table td:first-child { color: var(--text-muted); width: 55%; }
.refund-table td:last-child { color: var(--text-strong); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

.landing-auth-wrap { background: #fff; padding: var(--space-10) var(--space-6); border-top: 1px solid var(--hanji-line); }
.landing-auth-wrap .auth-card { max-width: 400px; margin: 0 auto; }

@media (max-width: 640px) {
  .credential-grid { grid-template-columns: 1fr; }
  .landing-hero h1 { font-size: var(--text-2xl); }
}

/* ===== misc content ===== */
.field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5) var(--space-6); }
.field-grid-2 { grid-template-columns: 1fr 1fr; }
.field-grid .f .k { display: block; font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: var(--space-2); }
.field-grid .f .v { font: var(--weight-medium) var(--text-md)/1.35 var(--font-sans); color: var(--text-strong); }
.lesson-row { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--neutral-100); animation: rise 280ms var(--ease-out) both; }
.lesson-row:last-child { border-bottom: none; }
.lesson-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3) var(--space-5); }
.lesson-cols .k { display: block; font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); margin-bottom: 2px; }
.lesson-cols .v { font: var(--weight-regular) var(--text-sm)/1.5 var(--font-sans); color: var(--text-body); }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .mobile-nav { display: flex; }
  .topbar { padding: var(--space-3) var(--space-4); }
  .who { display: none; }
  .crumbs { display: none; }
  .search-input { width: 150px; }
  .view { padding: var(--space-4); }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .dash-grid { grid-template-columns: 1fr !important; }
  .detail-grid { grid-template-columns: 1fr !important; }
  .field-grid { grid-template-columns: 1fr; }
  .req-grid { grid-template-columns: 1fr !important; }
  .lesson-cols { grid-template-columns: 1fr; }
  .table-head { display: none; }
  .table-row.grid-students, .table-row.grid-payments { grid-template-columns: 1fr; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); }
  .agenda-row { grid-template-columns: auto 8px 1fr; }
  .agenda-row .agenda-session { display: none; }
}
</style>

<body>

<div id="app"></div>

<script>
(function () {
  "use strict";

  var RATE = 20;
  var PACK = 8;

  var TERMS_TEXT = "제1조 (목적)\n" +
    "이 약관은 세이스강 클래스 매니저(이하 \"서비스\")가 제공하는 한국어 1:1 개인교습 관리 서비스의 이용 조건 및 절차, 이용자와 운영자의 권리·의무를 규정합니다.\n\n" +
    "제2조 (회원가입)\n" +
    "이용자는 이메일과 비밀번호를 입력하고 본 약관 및 개인정보처리방침에 동의함으로써 회원가입을 신청하며, 이메일 인증을 완료한 시점에 가입이 확정됩니다.\n\n" +
    "제3조 (서비스의 제공)\n" +
    "서비스는 수강 신청, 학생 관리, 결제·회차 관리, 수업 기록, 교안·과제 자료 업로드 등의 기능을 제공합니다. 운영상 필요에 따라 서비스의 전부 또는 일부가 변경되거나 중단될 수 있습니다.\n\n" +
    "제4조 (이용자의 의무)\n" +
    "이용자는 본인의 계정 정보를 안전하게 관리해야 하며, 타인의 정보를 도용하거나 서비스를 부정하게 이용해서는 안 됩니다.\n\n" +
    "제5조 (면책)\n" +
    "운영자는 천재지변, 통신 장애 등 불가항력적인 사유로 서비스를 제공할 수 없는 경우 책임을 지지 않습니다.\n\n" +
    "제6조 (약관의 변경)\n" +
    "운영자는 필요한 경우 관련 법령을 위반하지 않는 범위에서 이 약관을 개정할 수 있으며, 개정 시 서비스 내 공지합니다.\n\n" +
    "부칙: 이 약관은 2026년 8월 26일부터 시행합니다.";

  var PRIVACY_TEXT = "1. 수집하는 개인정보 항목\n" +
    "이메일 주소, 비밀번호(암호화 저장), 이름(선택 입력)\n\n" +
    "2. 수집 및 이용 목적\n" +
    "회원 식별 및 로그인, 수강 신청·결제·수업 기록 등 서비스 제공, 비밀번호 재설정 등 계정 관리\n\n" +
    "3. 보유 및 이용 기간\n" +
    "회원 탈퇴 시 또는 목적 달성 시까지 보관하며, 관련 법령에 따라 보존이 필요한 경우 해당 기간 동안 보관합니다.\n\n" +
    "4. 제3자 제공\n" +
    "수집한 개인정보는 법령에 특별한 규정이 있는 경우를 제외하고 이용자의 동의 없이 제3자에게 제공하지 않습니다.\n\n" +
    "5. 이용자의 권리\n" +
    "이용자는 언제든지 자신의 개인정보 열람, 정정, 삭제를 요청할 수 있습니다.\n\n" +
    "6. 문의처\n" +
    "개인정보 관련 문의는 서비스 운영자에게 연락해주세요.";

  var PAY = {
    paid: { label: "입금 완료", tone: "success" },
    pending: { label: "입금 대기", tone: "warning" },
    overdue: { label: "연체", tone: "danger" }
  };

  function getSavedEmail() {
    try { return localStorage.getItem("savedEmail") || ""; } catch (e) { return ""; }
  }
  function setSavedEmail(email) {
    try {
      if (email) localStorage.setItem("savedEmail", email);
      else localStorage.removeItem("savedEmail");
    } catch (e) { /* 저장소 접근 불가 — 무시 */ }
  }


  var ADMIN_ONLY_VIEWS = ["dash", "requests", "students", "student", "payments"];
  var NAV_DEFS = [
    ["개요", "Overview", "dash", true],
    ["수강 신청", "Requests", "requests", true],
    ["학생", "Students", "students", true],
    ["결제", "Payments", "payments", true],
    ["교안", "Materials", "materials", false],
    ["과제방", "Assignments", "assignments", false],
    ["수업 일정", "Schedule", null, true],
    ["설정", "Settings", "settings", false]
  ];

  var state = {
    view: "dash", student: "s1", query: "", filter: "전체", payFilter: "전체",
    modal: null, note: "", toast: null, toastBody: "", toastTone: "success",
    alerts: {},
    authReady: false, auth: null, authTab: "login", authError: "", authBusy: false,
    authPendingVerify: null, authUnverifiedEmail: "",
    authForgot: null, authForgotBusy: false, authForgotError: "",
    authResetToken: null, authResetBusy: false, authResetError: "",
    authAgreeTerms: false, authTermsModal: null, authConfirmAge: false,
    savedEmail: getSavedEmail(), authRememberEmail: !!getSavedEmail(),
    students: [], requests: [], invoices: [], dashboardReady: false,
    materials: [], materialsLoaded: false, materialsBusy: false, materialsError: "",
    materialsUploadBusy: false, materialsUploadError: "",
    assignments: [], assignmentsLoaded: false, assignmentsBusy: false, assignmentsError: "",
    assignmentsUploadBusy: false, assignmentsUploadError: "",
    myStudent: null, myStudentChecked: false,
    adminStudents: [], adminStudentsLoaded: false, selectedStudentId: null,
    assignmentEditId: null, assignmentEditTitle: "",
    adminUsers: [], adminUsersLoaded: false,
    studentEmailEditId: null, studentEmailEditValue: ""
  };
  var pendingRequest = null;
  var toastTimer = null;

  function esc(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function setState(patch) { Object.assign(state, patch); render(); }
  function remainOf(st) { return st.total - st.used; }
  function colorVar(st) {
    var r = remainOf(st);
    return r <= 1 ? "var(--danger-500)" : r <= 2 ? "var(--amber-500)" : "var(--green-500)";
  }
  function nameOf(sid) { var s = state.students.find(function (x) { return x.id === sid; }); return s ? s.name : "—"; }
  function fire(title, body, tone) {
    clearTimeout(toastTimer);
    setState({ toast: title, toastBody: body || "", toastTone: tone || "success" });
    toastTimer = setTimeout(function () { setState({ toast: null }); }, 5200);
  }
  function go(view, studentId) {
    var patch = { view: view };
    if (studentId) patch.student = studentId;
    setState(patch);
    if (view === "materials" && !state.materialsLoaded) loadMaterials();
    if (view === "assignments") loadAssignmentsView();
    if (view === "settings" && state.auth && state.auth.role === "admin") {
      if (!state.adminStudentsLoaded) loadAdminStudents();
      if (!state.adminUsersLoaded) loadAdminUsers();
    }
  }

  function openFileInline(url, mimeType) {
    var win = window.open("", "_blank");
    fetch(url)
      .then(function (res) { return res.blob(); })
      .then(function (blob) {
        var displayBlob = mimeType === "text/markdown" ? new Blob([blob], { type: "text/plain;charset=utf-8" }) : blob;
        if (win) win.location.href = URL.createObjectURL(displayBlob);
        else window.open(URL.createObjectURL(displayBlob), "_blank");
      })
      .catch(function () { if (win) win.location.href = url; else window.open(url, "_blank"); });
  }

  function formatBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }

  function loadMaterials() {
    if (state.materialsBusy) return;
    setState({ materialsBusy: true, materialsError: "" });
    fetch("/api/materials")
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ materialsBusy: false, materialsLoaded: true, materialsError: r.data.error || "불러오기에 실패했습니다." }); return; }
        setState({ materialsBusy: false, materialsLoaded: true, materialsError: "", materials: r.data.materials });
      })
      .catch(function () { setState({ materialsBusy: false, materialsLoaded: true, materialsError: "서버에 연결할 수 없습니다." }); });
  }

  function submitMaterialUpload(e) {
    e.preventDefault();
    if (state.materialsUploadBusy) return;
    var fileInput = document.getElementById("material-file");
    var file = fileInput && fileInput.files[0];
    if (!file) return;
    var titleInput = document.getElementById("material-title");
    var fd = new FormData();
    fd.append("file", file);
    if (titleInput && titleInput.value.trim()) fd.append("title", titleInput.value.trim());
    setState({ materialsUploadBusy: true, materialsUploadError: "" });
    fetch("/api/materials", { method: "POST", body: fd })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ materialsUploadBusy: false, materialsUploadError: r.data.error || "업로드에 실패했습니다." }); return; }
        setState({ materialsUploadBusy: false, materialsUploadError: "", materials: [r.data.material].concat(state.materials) });
        fire("업로드 완료", r.data.material.title + " 파일이 등록되었습니다.", "success");
      })
      .catch(function () { setState({ materialsUploadBusy: false, materialsUploadError: "서버에 연결할 수 없습니다." }); });
  }

  function deleteMaterialById(id) {
    fetch("/api/materials/" + id, { method: "DELETE" })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { fire("삭제 실패", r.data.error || "다시 시도해주세요.", "warning"); return; }
        setState({ materials: state.materials.filter(function (m) { return m.id !== id; }) });
        fire("삭제 완료", "교안이 삭제되었습니다.", "success");
      })
      .catch(function () { fire("삭제 실패", "서버에 연결할 수 없습니다.", "warning"); });
  }

  /* ===== assignments (과제방) ===== */
  function loadAssignmentsView() {
    var isAdmin = state.auth && state.auth.role === "admin";
    if (isAdmin) {
      if (!state.adminStudentsLoaded) loadAdminStudents();
    } else if (!state.myStudentChecked) {
      loadMyStudent();
    }
  }

  function loadAdminStudents() {
    fetch("/api/students")
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ adminStudentsLoaded: true, assignmentsError: r.data.error || "불러오기에 실패했습니다." }); return; }
        setState({ adminStudentsLoaded: true, adminStudents: r.data.students });
      })
      .catch(function () { setState({ adminStudentsLoaded: true, assignmentsError: "서버에 연결할 수 없습니다." }); });
  }

  function selectAdminStudent(id) {
    setState({ selectedStudentId: id, assignmentsLoaded: false, assignments: [] });
    loadAssignments(id);
  }

  function loadMyStudent() {
    fetch("/api/students/me")
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ myStudentChecked: true, myStudent: null }); return; }
        setState({ myStudentChecked: true, myStudent: r.data.student });
        if (r.data.student) loadAssignments(r.data.student.id);
      })
      .catch(function () { setState({ myStudentChecked: true, myStudent: null }); });
  }

  function loadAssignments(studentId) {
    if (!studentId) return;
    setState({ assignmentsBusy: true, assignmentsError: "" });
    fetch("/api/assignments?studentId=" + encodeURIComponent(studentId))
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ assignmentsBusy: false, assignmentsLoaded: true, assignmentsError: r.data.error || "불러오기에 실패했습니다." }); return; }
        setState({ assignmentsBusy: false, assignmentsLoaded: true, assignmentsError: "", assignments: r.data.assignments });
      })
      .catch(function () { setState({ assignmentsBusy: false, assignmentsLoaded: true, assignmentsError: "서버에 연결할 수 없습니다." }); });
  }

  function submitAssignmentUpload(e) {
    e.preventDefault();
    if (state.assignmentsUploadBusy || !state.myStudent) return;
    var fileInput = document.getElementById("assignment-file");
    var file = fileInput && fileInput.files[0];
    if (!file) return;
    var titleInput = document.getElementById("assignment-title");
    var fd = new FormData();
    fd.append("file", file);
    fd.append("studentId", state.myStudent.id);
    if (titleInput && titleInput.value.trim()) fd.append("title", titleInput.value.trim());
    setState({ assignmentsUploadBusy: true, assignmentsUploadError: "" });
    fetch("/api/assignments", { method: "POST", body: fd })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ assignmentsUploadBusy: false, assignmentsUploadError: r.data.error || "업로드에 실패했습니다." }); return; }
        setState({ assignmentsUploadBusy: false, assignmentsUploadError: "", assignments: [r.data.assignment].concat(state.assignments) });
        fire("업로드 완료", r.data.assignment.title + " 파일이 등록되었습니다.", "success");
      })
      .catch(function () { setState({ assignmentsUploadBusy: false, assignmentsUploadError: "서버에 연결할 수 없습니다." }); });
  }

  function startEditAssignment(id, currentTitle) {
    setState({ assignmentEditId: id, assignmentEditTitle: currentTitle });
  }

  function cancelEditAssignment() {
    setState({ assignmentEditId: null, assignmentEditTitle: "" });
  }

  function saveEditAssignment(id) {
    var title = (state.assignmentEditTitle || "").trim();
    if (!title) return;
    fetch("/api/assignments/" + id, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: title })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { fire("수정 실패", r.data.error || "다시 시도해주세요.", "warning"); return; }
        setState({
          assignmentEditId: null, assignmentEditTitle: "",
          assignments: state.assignments.map(function (a) { return a.id === id ? r.data.assignment : a; })
        });
        fire("수정 완료", "제목이 변경되었습니다.", "success");
      })
      .catch(function () { fire("수정 실패", "서버에 연결할 수 없습니다.", "warning"); });
  }

  function deleteAssignmentById(id) {
    fetch("/api/assignments/" + id, { method: "DELETE" })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { fire("삭제 실패", r.data.error || "다시 시도해주세요.", "warning"); return; }
        setState({ assignments: state.assignments.filter(function (a) { return a.id !== id; }) });
        fire("삭제 완료", "과제가 삭제되었습니다.", "success");
      })
      .catch(function () { fire("삭제 실패", "서버에 연결할 수 없습니다.", "warning"); });
  }

  /* ===== settings (관리자: 회원 목록 · 수강생 이메일 관리) ===== */

    fetch("/api/admin/users")
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ adminUsersLoaded: true }); return; }
        setState({ adminUsersLoaded: true, adminUsers: r.data.users });

      .catch(function () { setState({ adminUsersLoaded: true }); });

    setState({ studentEmailEditId: id, studentEmailEditValue: currentEmail });

  function cancelEditStudentEmail() {
    setState({ studentEmailEditId: null, studentEmailEditValue: "" });
  }

    if (!email) return;
    fetch("/api/students/" + id, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { fire("수정 실패", r.data.error || "다시 시도해주세요.", "warning"); return; }

          studentEmailEditId: null, studentEmailEditValue: "",

  function applyDashboardSnapshot(data) {
    state.students = data.students;
    state.invoices = data.invoices;
    state.requests = data.requests;
  }

  function loadDashboard() {
    fetch("/api/dashboard")
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { state.dashboardReady = true; render(); return; }
        applyDashboardSnapshot(r.data);
        state.dashboardReady = true;
        render();
      })
      .catch(function () { state.dashboardReady = true; render(); });
  }

  function approve(id) {
    var r = state.requests.find(function (x) { return x.id === id; });
    if (!r) return;
    setState({ modal: null });
    fetch("/api/requests/" + id + "/approve", { method: "POST" })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) { fire("승인 실패", result.data.error || "다시 시도해주세요.", "warning"); return; }
        applyDashboardSnapshot(result.data);
        state.alerts[result.data.studentId] = true;
        setState({ view: "student", student: result.data.studentId });
        fire(r.name + " 님 등록 완료 — 8회차 자동 편성", r.slot + " 슬롯으로 8회차가 배정되고 $" + (PACK * RATE) + " 인보이스가 발행되었습니다.", "success");
      })
      .catch(function () { fire("승인 실패", "서버에 연결할 수 없습니다.", "warning"); });
  }

  function logLesson() {
    var studentId = state.student, note = state.note;
    setState({ modal: null, note: "" });
    fetch("/api/students/" + studentId + "/lessons", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ note: note })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) { fire("수업 기록 실패", result.data.error || "다시 시도해주세요.", "warning"); return; }
        applyDashboardSnapshot(result.data);
        render();
        var left = result.data.totalSessions - result.data.usedSessions;
        if (left <= 2) {
          fire("수업 기록 완료 — 잔여 " + left + "회", "잔여 2회 이하입니다. 다음 8회 인보이스를 미리 발행해 보이스톡 일정을 이어가세요.", "warning");
        } else {
          fire("수업 기록 완료 — 잔여 " + left + "회", "학습 기록에 발음·어휘·과제가 저장되었습니다.", "success");
        }
      })
      .catch(function () { fire("수업 기록 실패", "서버에 연결할 수 없습니다.", "warning"); });
  }

  function issueInvoice() {
    var studentId = state.student;
    var st = state.students.find(function (x) { return x.id === studentId; });
    setState({ modal: null });
    fetch("/api/students/" + studentId + "/invoices", { method: "POST" })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) { fire("발행 실패", result.data.error || "다시 시도해주세요.", "warning"); return; }
        applyDashboardSnapshot(result.data);
        render();
        fire("인보이스 발행 — $" + (PACK * RATE), (st ? st.name : "") + " 님에게 9월 8회 패키지 청구서를 보냈습니다. 입금 확인 시 회차가 충전됩니다.", "info");
      })
      .catch(function () { fire("발행 실패", "서버에 연결할 수 없습니다.", "warning"); });
  }

  function confirmPayment(id) {
    fetch("/api/invoices/" + id + "/confirm", { method: "POST" })

        render();

      })
      .catch(function () { fire("입금 확인 실패", "서버에 연결할 수 없습니다.", "warning"); });

  function notYet() { fire("이 화면은 다음 단계에서 만들어요", "지금은 수강 신청 · 학습 관리 · 결제 관리 흐름만 동작합니다.", "info"); }

  /* ===== rendering ===== */
  function badge(label, tone, dot) {
    return '<span class="badge tone-' + tone + '">' + (dot ? '<span class="dot"></span>' : "") + esc(label) + "</span>";
  }
  function bar(pct, color) {
    return '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>';
  }

  function navHtml(kind) {
    var isAdmin = state.auth && state.auth.role === "admin";
    var active = state.view === "student" ? "students" : state.view;
    return NAV_DEFS.filter(function (d) { return !d[3] || isAdmin; }).map(function (d) {
      var ko = d[0], en = d[1], key = d[2];
      var on = key === active;
      var countMap = { requests: state.requests.length, students: state.students.length, payments: state.invoices.filter(function (v) { return v.status !== "paid"; }).length };
      var count = countMap[key] || "";
      if (kind === "side") {
        var sideAttr = key ? ' data-nav="' + key + '"' : ' data-notyet="1"';
        return '<button class="side-nav-item' + (on ? " is-active" : "") + (key ? "" : " is-soon") + '"' + sideAttr + '>' +
          '<span><span class="ko">' + esc(ko) + '</span><span class="en">' + esc(en) + '</span></span>' +
          '<span class="count">' + esc(count) + '</span></button>';
      }
      var chipAttr = key ? ' data-nav="' + key + '"' : ' data-notyet="1"';
      return '<span class="chip' + (on ? " is-active" : "") + (key ? "" : " is-soon") + '"' + chipAttr + '>' + esc(ko) + '</span>';
    }).join("");
  }

  function sidebarHtml() {
    return '' +
      '<aside class="sidebar">' +
      '<div class="brand-row"><span class="brand-mark">한</span><span><span class="brand-name" style="display:block">한국어 수업 관리</span><span class="brand-sub">1:1 Voice Lessons</span></span></div>' +
      '<nav class="side-nav">' + navHtml("side") + '</nav>' +
      '<div class="package-box"><span class="lbl">기본 패키지</span><span class="big tabular">월 ' + PACK + '회 · $' + (PACK * RATE) + '</span>' +
      '<span class="fine">주 2회 · 1회 50분 · 회당 $' + RATE + '<br>보이스톡 1:1 · 추가 회차 별도 협의</span></div>' +
      '</aside>';
  }

  function crumbFor(view, st) {
    var map = { dash: "개요 / Overview", requests: "수강 신청 / Requests", students: "학생 / Students", student: "학생 / Students", payments: "결제 / Payments", materials: "교안 / Materials", assignments: "과제방 / Assignments", settings: "설정 / Settings" };
    return { root: map[view] || "", leaf: view === "student" && st ? st.name : "" };
  }

  function clockText() {
    var now = new Date();
    var kst = now.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", hour12: false, month: "long", day: "numeric" });
    var local = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    var tzLabel = "UTC" + (-now.getTimezoneOffset() >= 0 ? "+" : "") + (-now.getTimezoneOffset() / 60);
    return "KST " + kst + " · 현지 " + local + " (" + tzLabel + ")";
  }

  function topbarHtml(st) {
    var c = crumbFor(state.view, st);
    var clock = clockText();
    var who = state.auth ? (state.auth.name || state.auth.email) : "이윤재 강사";
    var roleBadge = state.auth && state.auth.role === "admin" ? badge("관리자", "brand", true) : "";
    return '' +
      '<header class="topbar">' +
      '<div class="crumbs"><span class="crumb-root">' + esc(c.root) + '</span>' +
      (c.leaf ? '<span class="crumb-sep">/</span><span class="crumb-leaf">' + esc(c.leaf) + '</span>' : "") + '</div>' +
      '<div class="topbar-right">' +
      '<span class="search-wrap"><span class="icon">⌕</span><input class="search-input" id="query-input" type="text" placeholder="학생·결제 검색" value="' + esc(state.query) + '"></span>' +
      '<span class="who"><span class="name">' + esc(who) + ' ' + roleBadge + '</span><span class="clock tabular">' + esc(clock) + '</span></span>' +
      '<button class="btn btn-secondary" id="logout-btn" style="height:32px;padding:0 var(--space-4)">로그아웃</button>' +
      '</div></header>' +
      '<div class="mobile-nav">' + navHtml("chip") + '</div>';
  }

  function renderAdminOnlyNotice() {
    return '<div class="card card--pad" style="color:var(--text-muted)">이 화면은 강사(관리자)만 볼 수 있습니다.</div>';
  }

  function statCard(label, value, unit, caption) {
    return '<div class="card stat-card"><span class="label">' + esc(label) + '</span>' +
      '<span class="value tabular">' + esc(value) + (unit ? '<span class="unit">' + esc(unit) + '</span>' : "") + '</span>' +
      '<span class="caption">' + esc(caption) + '</span></div>';
  }

  function renderDash() {
    var students = state.students, invoices = state.invoices;
    var pendingSum = invoices.filter(function (v) { return v.status === "pending"; }).reduce(function (a, v) { return a + v.amount; }, 0);
    var overdueSum = invoices.filter(function (v) { return v.status === "overdue"; }).reduce(function (a, v) { return a + v.amount; }, 0);
    var unpaidLabel = "$" + (pendingSum + overdueSum);
    var monthDone = students.reduce(function (a, x) { return a + x.lessons.length; }, 0);
    var lowList = students.filter(function (x) { return remainOf(x) <= 2; });
    var pendingCount = invoices.filter(function (v) { return v.status === "pending"; }).length;
    var overdueCount = invoices.filter(function (v) { return v.status === "overdue"; }).length;

    var agenda = students.map(function (x) {
      var lastLesson = x.lessons[0];
      return {
        kst: x.slot || "일정 미정", local: x.local || "", sid: x.id,
        meta: (x.level || "") + " · " + (lastLesson ? lastLesson.topic : x.goal || "첫 수업 예정"),
        session: x.used + "/" + x.total,
        dot: x.pay === "overdue" ? "var(--danger-500)" : x.pay === "pending" ? "var(--info-500)" : "var(--green-500)"
      };
    });

    var lowBalance = lowList.concat(students.filter(function (x) { return remainOf(x) > 2; }).slice(0, 1));
    var dueInvoices = invoices.filter(function (v) { return v.status !== "paid"; });

    return '' +
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-4)">' +
      '<div style="display:flex;flex-direction:column;gap:var(--space-2)">' +
      '<span class="eyebrow">' + esc(clockText()) + '</span>' +
      '<h1 style="font:var(--weight-extrabold) var(--text-3xl)/1.15 var(--font-sans);letter-spacing:-0.02em;color:var(--text-strong)">안녕, ' + esc(state.auth.name || state.auth.email) + '님</h1>' +
      '<p style="font:var(--weight-semibold) var(--text-lg)/1.3 var(--font-sans);color:var(--text-body)">등록 학생 ' + students.length + '명, 미수금 ' + esc(unpaidLabel) + '</p>' +
      '<p style="color:var(--text-muted)">신청을 승인하면 주 2회 8회차와 인보이스가 자동으로 만들어집니다.</p></div>' +
      '<div style="display:flex;gap:var(--space-3)"><button class="btn btn-secondary" data-nav="payments">결제 관리</button>' +
      '<button class="btn btn-primary" data-nav="requests">수강 신청 ' + state.requests.length + '건</button></div></div>' +

      '<div class="stat-grid">' +
      statCard("등록 학생 / Students", String(students.length), "명", students.map(function (x) { return x.name; }).join(" · ") || "등록된 학생이 없습니다") +
      statCard("누적 수업 / Lessons", String(monthDone), "회", "수업 기록에 저장된 회차 합계") +
      statCard("미수금 / Unpaid", unpaidLabel, "", "대기 " + pendingCount + "건 · 연체 " + overdueCount + "건") +
      statCard("회차 소진 임박 / Low", String(lowList.length), "명", "잔여 2회 이하 — 재결제 안내 필요") +
      '</div>' +

      '<div class="dash-grid" style="display:grid;grid-template-columns:1.4fr 1fr;gap:var(--space-4);align-items:start">' +
      '<div class="card"><div class="card-head"><span class="title">학생별 고정 슬롯</span><span class="note">KST · 학생 현지 시각</span></div>' +
      (agenda.length ? agenda.map(function (row) {
        return '<div class="agenda-row" data-goto-student="' + row.sid + '">' +
          '<span><span class="tabular" style="display:block;font:var(--weight-bold) var(--text-md)/1.2 var(--font-sans);color:var(--text-strong)">' + esc(row.kst) + '</span>' +
          '<span class="tabular" style="display:block;font-size:var(--text-xs);color:var(--text-muted)">' + esc(row.local) + '</span></span>' +
          '<span class="dot-lg" style="background:' + row.dot + '"></span>' +
          '<span><span style="display:block;font:var(--weight-semibold) var(--text-md)/1.3 var(--font-sans);color:var(--text-strong)">' + esc(nameOf(row.sid)) + '</span>' +
          '<span style="display:block;font-size:var(--text-sm);color:var(--text-muted)">' + esc(row.meta) + '</span></span>' +
          '<span class="agenda-session" style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">' +
          '<span class="tabular" style="font:var(--weight-semibold) var(--text-sm)/1 var(--font-sans);color:var(--green-600)">' + esc(row.session) + '</span>' +
          '</span></div>';
      }).join("") : '<div style="padding:var(--space-6);color:var(--text-muted)">등록된 학생이 없습니다.</div>') + '</div>' +

      '<div style="display:flex;flex-direction:column;gap:var(--space-4)">' +
      '<div class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-4)">' +
      '<span style="font:var(--weight-bold) var(--text-md)/1 var(--font-sans);color:var(--text-strong)">잔여 회차 · 재결제 안내</span>' +
      lowBalance.map(function (x) {
        return '<div data-goto-student="' + x.id + '" style="cursor:pointer;display:flex;flex-direction:column;gap:var(--space-2)">' +
          '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3)">' +
          '<span style="font:var(--weight-semibold) var(--text-sm)/1.3 var(--font-sans);color:var(--text-body)">' + esc(x.name) + '</span>' +
          '<span class="tabular" style="font:var(--weight-bold) var(--text-sm)/1 var(--font-sans);color:' + colorVar(x) + '">' + remainOf(x) + '/' + x.total + '회</span></div>' +
          bar(Math.round((remainOf(x) / x.total) * 100), colorVar(x)) + '</div>';
      }).join("") + '</div>' +

      '<div class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-3)">' +
      '<span style="font:var(--weight-bold) var(--text-md)/1 var(--font-sans);color:var(--text-strong)">확인이 필요한 결제</span>' +
      dueInvoices.map(function (v) {
        return '<div data-nav="payments" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-2) 0;border-bottom:1px solid var(--neutral-100)">' +
          '<span style="display:flex;flex-direction:column;gap:1px"><span style="font:var(--weight-semibold) var(--text-sm)/1.3 var(--font-sans);color:var(--text-body)">' + esc(nameOf(v.sid)) + '</span>' +
          '<span style="font-size:var(--text-xs);color:var(--text-muted)">' + esc(v.period + " · $" + v.amount + " · " + v.method) + '</span></span>' +
          badge(PAY[v.status].label, PAY[v.status].tone, true) + '</div>';
      }).join("") + '</div></div></div>';
  }

  function renderRequests() {
    var requests = state.requests;
    var header = '<div style="display:flex;flex-direction:column;gap:var(--space-2)"><span class="eyebrow">Requests</span>' +
      '<h1 style="font:var(--weight-extrabold) var(--text-2xl)/1.2 var(--font-sans);letter-spacing:-0.02em;color:var(--text-strong)">수강 신청</h1>' +
      '<span style="color:var(--text-muted)">승인하면 희망 요일 기준 8회차가 자동 편성되고 $' + (PACK * RATE) + ' 인보이스가 발행됩니다.</span></div>';

    var grid = '<div class="req-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-4)">' +
      requests.map(function (r) {
        var fields = [["희망 레벨", r.level], ["희망 슬롯", r.wish], ["유입 경로", r.via], ["언어", r.lang]];
        return '<div class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-4)">' +
          '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3)">' +
          '<span><span style="display:block;font:var(--weight-bold) var(--text-lg)/1.2 var(--font-sans);color:var(--text-strong)">' + esc(r.name) + '</span>' +
          '<span style="display:block;color:var(--text-muted)">' + esc(r.region + " · " + r.offset) + '</span></span>' +
          badge(r.state, r.tone, true) + '</div>' +
          '<div class="field-grid field-grid-2">' + fields.map(function (f) {
            return '<span class="f"><span class="k">' + esc(f[0]) + '</span><span class="v" style="font-size:var(--text-sm)">' + esc(f[1]) + '</span></span>';
          }).join("") + '</div>' +
          '<span style="font-size:var(--text-sm);color:var(--text-body);padding:var(--space-3) var(--space-4);background:var(--neutral-50);border-radius:var(--radius-md)">' + esc(r.note) + '</span>' +
          '<div style="display:flex;gap:var(--space-3);justify-content:flex-end">' +
          '<button class="btn btn-ghost" data-notyet="1">보류</button>' +
          '<button class="btn btn-primary" data-approve="' + r.id + '">승인 · 8회 편성</button></div></div>';
      }).join("") + '</div>';

    var empty = requests.length ? "" : '<div class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-2)">' +
      '<span style="font:var(--weight-semibold) var(--text-md)/1.3 var(--font-sans);color:var(--text-strong)">대기 중인 신청이 없습니다.</span>' +
      '<span style="color:var(--text-muted)">승인한 신청은 학생 목록에서 확인할 수 있습니다.</span></div>';

    return header + grid + empty;
  }

  function renderStudents() {
    var q = state.query.trim().toLowerCase();
    var lowCount = state.students.filter(function (x) { return remainOf(x) <= 2; }).length;
    var summary = "활동 " + state.students.length + "명 · 주 2회 고정 슬롯 · 잔여 2회 이하 " + lowCount + "명";
    var filterDefs = ["전체", "입금 완료", "입금 대기", "연체", "잔여 2회 이하"];
    var rows = state.students.filter(function (st) {
      if (q && !(st.name + st.where + st.level + st.goal).toLowerCase().includes(q)) return false;
      if (state.filter === "전체") return true;
      if (state.filter === "잔여 2회 이하") return remainOf(st) <= 2;
      return PAY[st.pay].label === state.filter;
    });

    return '' +
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-4)">' +
      '<div style="display:flex;flex-direction:column;gap:var(--space-2)"><span class="eyebrow">Students</span>' +
      '<h1 style="font:var(--weight-extrabold) var(--text-2xl)/1.2 var(--font-sans);letter-spacing:-0.02em;color:var(--text-strong)">학생 관리</h1>' +
      '<span style="color:var(--text-muted)">' + esc(summary) + '</span></div>' +
      '<button class="btn btn-primary" data-nav="requests">신청에서 등록</button></div>' +

      '<div class="filter-row">' + filterDefs.map(function (label) {
        return '<span class="filter-chip' + (label === state.filter ? " is-active" : "") + '" data-filter="' + esc(label) + '">' + esc(label) + '</span>';
      }).join("") + '</div>' +

      '<div class="card" style="overflow:hidden">' +
      '<div class="table-head grid-students"><span>학생</span><span>거주 / 시차</span><span>레벨</span><span>고정 슬롯 (KST)</span><span>잔여 회차</span><span>결제</span></div>' +
      '<div class="table-body">' + rows.map(function (st) {
        var pct = Math.round((remainOf(st) / st.total) * 100);
        return '<div class="table-row grid-students" data-goto-student="' + st.id + '">' +
          '<span style="display:flex;align-items:center;gap:var(--space-3);min-width:0">' +
          '<span class="avatar-init">' + esc(st.initials) + '</span>' +
          '<span><span style="display:block;font:var(--weight-semibold) var(--text-md)/1.3 var(--font-sans);color:var(--text-strong)">' + esc(st.name) + '</span>' +
          '<span style="display:block;font-size:var(--text-xs);color:var(--text-muted)">' + esc(st.goal) + '</span></span></span>' +
          '<span><span style="display:block;font-size:var(--text-sm)">' + esc(st.where) + '</span><span class="tabular" style="display:block;font-size:var(--text-xs);color:var(--text-muted)">' + esc(st.offset) + '</span></span>' +
          '<span style="font-size:var(--text-sm)">' + esc(st.level) + '</span>' +
          '<span class="tabular" style="font-size:var(--text-sm)">' + esc(st.slot) + '</span>' +
          '<span style="display:flex;align-items:center;gap:var(--space-3)"><span style="flex:1;max-width:80px">' + bar(pct, colorVar(st)) + '</span>' +
          '<span class="tabular" style="font:var(--weight-semibold) var(--text-xs)/1 var(--font-sans);color:var(--text-muted);white-space:nowrap">' + remainOf(st) + '/' + st.total + '</span></span>' +
          '<span>' + badge(PAY[st.pay].label, PAY[st.pay].tone, true) + '</span></div>';
      }).join("") + '</div></div>';
  }

  function renderStudent() {
    var st = state.students.find(function (x) { return x.id === state.student; }) || state.students[0];
    var invoices = state.invoices.filter(function (v) { return v.sid === st.id; });
    var paidTotal = invoices.filter(function (v) { return v.status === "paid"; }).reduce(function (a, v) { return a + v.amount; }, 0);
    var remainPct = Math.round((remainOf(st) / st.total) * 100);
    var justApproved = !!state.alerts[st.id];

    var alertHtml = "";
    if (justApproved) {
      alertHtml = '<div class="alert tone-success"><div><div class="title">8회차 자동 편성 완료 · 인보이스 발행됨</div>' +
        '<div class="body">' + esc(st.slot) + ' KST 슬롯으로 8회차가 배정되었고, $' + (PACK * RATE) + ' 청구서가 발행되었습니다. 입금 확인 시 회차가 충전됩니다.</div></div></div>';
    } else if (st.pay === "overdue") {
      alertHtml = '<div class="alert tone-danger"><div><div class="title">결제가 9일 지연되었습니다</div>' +
        '<div class="body">잔여 회차가 0회입니다. 입금 확인 전까지 다음 보이스톡 일정을 잡지 않는 것을 권장합니다.</div></div></div>';
    }

    var remainNote = remainOf(st) <= 2
      ? "잔여 " + remainOf(st) + "회 — 다음 8회 패키지($" + (PACK * RATE) + ") 발행이 필요합니다."
      : "이번 패키지 " + st.total + "회 중 " + st.used + "회 진행 · 주 2회 기준 " + Math.ceil(remainOf(st) / 2) + "주치 남음";

    return '' +
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:var(--space-4)">' +
      '<div style="display:flex;flex-direction:column;gap:var(--space-3);min-width:0">' +
      '<span data-nav="students" style="font:var(--weight-medium) var(--text-sm)/1 var(--font-sans);color:var(--green-600);cursor:pointer">← 학생 목록</span>' +
      '<div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">' +
      '<h1 style="font:var(--weight-extrabold) var(--text-2xl)/1.2 var(--font-sans);letter-spacing:-0.02em;color:var(--text-strong)">' + esc(st.name) + '</h1>' +
      badge(PAY[st.pay].label, PAY[st.pay].tone, true) + badge(st.level, "neutral", false) + '</div>' +
      '<span style="color:var(--text-muted)">' + esc(st.where + " · " + st.offset + " · " + st.slot + " KST (" + st.local + ") · 1회 50분 보이스톡") + '</span></div>' +
      '<div style="display:flex;gap:var(--space-3)"><button class="btn btn-secondary" data-open-modal="invoice">인보이스 발행</button>' +
      '<button class="btn btn-primary" data-open-modal="lesson">수업 완료 기록</button></div></div>' +

      alertHtml +

      '<div class="detail-grid" style="display:grid;grid-template-columns:1fr 360px;gap:var(--space-4);align-items:start">' +
      '<div style="display:flex;flex-direction:column;gap:var(--space-4);min-width:0">' +
      '<div class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-5)">' +
      '<span style="font:var(--weight-bold) var(--text-md)/1 var(--font-sans);color:var(--text-strong)">수강 정보</span>' +
      '<div class="field-grid">' + st.fields.map(function (f) {
        return '<span class="f"><span class="k">' + esc(f[0]) + '</span><span class="v">' + esc(f[1]) + '</span></span>';
      }).join("") + '</div></div>' +

      '<div class="card"><div class="card-head"><span class="title">학습 기록 · 보이스톡 50분</span>' +
      '<span class="tabular" style="font:var(--weight-semibold) var(--text-sm)/1 var(--font-sans);color:var(--green-600)">누적 ' + st.lessons.length + '회 기록</span></div>' +
      (st.lessons.length ? st.lessons.map(function (l) {
        return '<div class="lesson-row"><div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-3)">' +
          '<span class="tabular" style="font:var(--weight-bold) var(--text-sm)/1 var(--font-sans);color:var(--text-strong)">' + l.no + '회차</span>' +
          '<span class="tabular" style="font-size:var(--text-xs);color:var(--text-muted)">' + esc(l.date) + '</span>' +
          '<span style="font:var(--weight-semibold) var(--text-sm)/1 var(--font-sans);color:var(--text-body)">' + esc(l.topic) + '</span>' +
          badge(l.attend, l.tone, false) + '</div>' +
          '<div class="lesson-cols">' +
          '<span><span class="k">발음 교정</span><span class="v">' + esc(l.pron) + '</span></span>' +
          '<span><span class="k">어휘 · 표현</span><span class="v">' + esc(l.vocab) + '</span></span>' +
          '<span><span class="k">과제</span><span class="v">' + esc(l.hw) + '</span></span>' +
          '</div></div>';
      }).join("") : '<div style="padding:var(--space-8) var(--space-6);display:flex;flex-direction:column;gap:var(--space-2)">' +
        '<span style="font:var(--weight-semibold) var(--text-sm)/1.4 var(--font-sans);color:var(--text-body)">아직 진행한 수업이 없습니다.</span>' +
        '<span style="color:var(--text-muted)">첫 수업을 마친 뒤 &lsquo;수업 완료 기록&rsquo;을 누르면 회차가 차감되고 기록이 남습니다.</span></div>') +
      '</div></div>' +

      '<div style="display:flex;flex-direction:column;gap:var(--space-4);min-width:0">' +
      '<div class="card card--pad ring-wrap">' +
      '<span style="align-self:flex-start;font:var(--weight-bold) var(--text-md)/1 var(--font-sans);color:var(--text-strong)">잔여 회차</span>' +
      ringSvg(remainPct, remainOf(st) + "/" + st.total, colorVar(st)) +
      '<span style="color:var(--text-muted)">' + esc(remainNote) + '</span>' +
      '<button class="btn btn-secondary full" data-open-modal="invoice">다음 8회 인보이스</button></div>' +

      '<div class="card"><div class="card-head"><span class="title">결제 이력</span><span class="tabular" style="font:var(--weight-semibold) var(--text-sm)/1 var(--font-sans);color:var(--text-muted)">입금 누계 $' + paidTotal + '</span></div>' +
      invoices.map(function (v) {
        return '<div data-nav="payments" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--neutral-100)">' +
          '<span style="display:flex;flex-direction:column;gap:2px"><span class="tabular" style="font:var(--weight-semibold) var(--text-sm)/1.3 var(--font-sans);color:var(--text-strong)">' + esc(v.period + " · " + v.sessions + "회") + '</span>' +
          '<span style="font-size:var(--text-xs);color:var(--text-muted)">' + esc(v.method + " · " + v.issued) + '</span></span>' +
          '<span style="display:flex;align-items:center;gap:var(--space-3)"><span class="tabular" style="font:var(--weight-bold) var(--text-sm)/1 var(--font-sans);color:var(--text-strong)">$' + v.amount + '</span>' +
          badge(PAY[v.status].label, PAY[v.status].tone, false) + '</span></div>';
      }).join("") + '</div></div></div>';
  }

  function ringSvg(pct, label, color) {
    var r = 40, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
    return '<svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="잔여 회차 ' + esc(label) + '">' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="var(--neutral-100)" stroke-width="8"></circle>' +
      '<circle cx="48" cy="48" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="8" stroke-linecap="round" ' +
      'stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" transform="rotate(-90 48 48)"></circle>' +
      '<text x="48" y="53" text-anchor="middle" font-family="var(--font-mono)" font-size="15" font-weight="600" fill="var(--text-strong)">' + esc(label) + '</text>' +
      '</svg>';
  }

  function renderPayments() {
    var invoices = state.invoices;
    var thisPeriodInvoices = invoices.filter(function (v) { return v.period === "2026-08"; });
    var billed = thisPeriodInvoices.reduce(function (a, v) { return a + v.amount; }, 0);
    var paidInvoices = invoices.filter(function (v) { return v.status === "paid"; });
    var paid = thisPeriodInvoices.filter(function (v) { return v.status === "paid"; }).reduce(function (a, v) { return a + v.amount; }, 0);
    var pendingInvoices = invoices.filter(function (v) { return v.status === "pending"; });
    var overdueInvoices = invoices.filter(function (v) { return v.status === "overdue"; });
    var pendingSum = pendingInvoices.reduce(function (a, v) { return a + v.amount; }, 0);
    var overdueSum = overdueInvoices.reduce(function (a, v) { return a + v.amount; }, 0);
    var paidMethods = paidInvoices.filter(function (v, i, arr) { return arr.map(function (x) { return x.method; }).indexOf(v.method) === i; }).map(function (v) { return v.method; });
    var q = state.query.trim().toLowerCase();
    var payFilterDefs = ["전체", "입금 완료", "입금 대기", "연체"];

    var rows = invoices.filter(function (v) {
      if (state.payFilter !== "전체" && PAY[v.status].label !== state.payFilter) return false;
      if (q && !(nameOf(v.sid) + v.method + v.period).toLowerCase().includes(q)) return false;
      return true;
    });

    return '' +
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-4)">' +
      '<div style="display:flex;flex-direction:column;gap:var(--space-2)"><span class="eyebrow">Payments</span>' +
      '<h1 style="font:var(--weight-extrabold) var(--text-2xl)/1.2 var(--font-sans);letter-spacing:-0.02em;color:var(--text-strong)">결제 관리</h1>' +
      '<span style="color:var(--text-muted)">회당 $' + RATE + ' · 월 ' + PACK + '회 $' + (PACK * RATE) + ' 기준 · 추가 회차는 별도 협의</span></div>' +
      '<button class="btn btn-primary" data-notyet="1">인보이스 내보내기</button></div>' +

      '<div class="stat-grid">' +
      statCard("8월 청구 / Billed", "$" + billed, "", thisPeriodInvoices.length + "건") +
      statCard("입금 완료 / Paid", "$" + paid, "", paidMethods.join(" · ") || "결제 내역 없음") +
      statCard("대기 / Pending", "$" + pendingSum, "", pendingInvoices.length + "건") +
      statCard("연체 / Overdue", "$" + overdueSum, "", overdueInvoices.length + "건") +
      '</div>' +

      '<div class="filter-row">' + payFilterDefs.map(function (label) {
        return '<span class="filter-chip' + (label === state.payFilter ? " is-active" : "") + '" data-payfilter="' + esc(label) + '">' + esc(label) + '</span>';
      }).join("") + '</div>' +

      '<div class="card" style="overflow:hidden">' +
      '<div class="table-head grid-payments"><span>학생</span><span>기간</span><span>회차</span><span>금액</span><span>수단 / 발행일</span><span>상태</span></div>' +
      '<div class="table-body">' + rows.map(function (v) {
        return '<div class="table-row grid-payments" data-goto-student="' + v.sid + '">' +
          '<span><span style="display:block;font:var(--weight-semibold) var(--text-md)/1.3 var(--font-sans);color:var(--text-strong)">' + esc(nameOf(v.sid)) + '</span>' +
          '<span style="display:block;font-size:var(--text-xs);color:var(--text-muted)">' + esc(v.kind) + '</span></span>' +
          '<span class="tabular" style="font-size:var(--text-sm)">' + esc(v.period) + '</span>' +
          '<span class="tabular" style="font-size:var(--text-sm)">' + v.sessions + '회</span>' +
          '<span class="tabular" style="font:var(--weight-bold) var(--text-md)/1 var(--font-sans);color:var(--text-strong)">$' + v.amount + '</span>' +
          '<span><span style="display:block;font-size:var(--text-sm)">' + esc(v.method) + '</span><span class="tabular" style="display:block;font-size:var(--text-xs);color:var(--text-muted)">' + esc(v.issued) + '</span></span>' +
          '<span style="display:flex;align-items:center;gap:var(--space-3)" data-stop="1">' + badge(PAY[v.status].label, PAY[v.status].tone, true) +
          (v.status !== "paid" ? '<span data-confirm-payment="' + v.id + '" style="font:var(--weight-semibold) var(--text-xs)/1 var(--font-sans);color:var(--green-600);cursor:pointer;white-space:nowrap">입금 확인</span>' : "") +
          '</span></div>';
      }).join("") + '</div></div>';
  }

  function renderMaterials() {
    var isAdmin = state.auth && state.auth.role === "admin";
    var rows = state.materials;
    return '' +
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-4)">' +
      '<div style="display:flex;flex-direction:column;gap:var(--space-2)"><span class="eyebrow">Materials</span>' +
      '<h1 style="font:var(--weight-extrabold) var(--text-2xl)/1.2 var(--font-sans);letter-spacing:-0.02em;color:var(--text-strong)">교안</h1>' +
      '<span style="color:var(--text-muted)">옵시디언 형식의 md 파일이나 pdf 파일로 수업 자료를 올려두고 관리하세요.</span></div>' +
      '</div>' +

      (isAdmin ?
        '<form id="material-upload-form" class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-3)">' +
        '<div><label class="field-label">제목 (선택)</label><input class="input" id="material-title" type="text" placeholder="예: 3주차 회의 표현 정리"></div>' +
        '<div><label class="field-label">파일 (.md 또는 .pdf, 20MB 이하)</label><input class="input" id="material-file" type="file" accept=".md,.pdf" required></div>' +
        (state.materialsUploadError ? '<div class="auth-error">' + esc(state.materialsUploadError) + '</div>' : "") +
        '<button class="btn btn-primary" type="submit" id="material-upload-submit" style="align-self:flex-start"' + (state.materialsUploadBusy ? " disabled" : "") + '>' +
        (state.materialsUploadBusy ? "업로드 중…" : "업로드") + '</button>' +
        '</form>'
        : "") +

      (state.materialsError ? '<div class="auth-error">' + esc(state.materialsError) + '</div>' : "") +

      (state.materialsBusy && !rows.length ? '<div class="card card--pad" style="color:var(--text-muted)">불러오는 중…</div>' :
        (!rows.length ? '<div class="card card--pad" style="color:var(--text-muted)">아직 등록된 교안이 없습니다.</div>' :
          '<div class="card">' + rows.map(function (m) {

      '<div style="color:var(--text-muted)">가입하신 이메일을 입력하시면 비밀번호를 새로 설정할 수 있는 링크를 보여드립니다.</div>' +

      '<div style="font:var(--weight-bold) var(--text-md)/1.3 var(--font-sans);color:var(--text-strong)">새 비밀번호 설정</div>' +
      '<div><label class="field-label">새 비밀번호</label><input class="input" id="reset-password" type="password" required placeholder="8자 이상" autocomplete="new-password"></div>' +
      (state.authResetError ? '<div class="auth-error">' + esc(state.authResetError) + '</div>' : "") +
