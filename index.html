<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세이스강 클래스 매니저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== tokens: base palette (from 푸른느낌 design system) ===== */
:root {
  --green-50:  #f0f7f3; --green-100: #d9ece2; --green-200: #a7d8c4; --green-300: #76c0a4; --green-400: #4aa183;
  --green-500: #1f6f5c; --green-600: #1a5d4d; --green-700: #15493d; --green-800: #0e3b30; --green-900: #082620;
  --neutral-0: #ffffff; --neutral-50: #f7f9f8; --neutral-100: #eef2f0; --neutral-200: #dfe5e2; --neutral-300: #c5cecb;
  --neutral-400: #9aa6a2; --neutral-500: #6f7c78; --neutral-600: #515c59; --neutral-700: #3a4340; --neutral-800: #262d2b; --neutral-900: #161b1a;
  --clay-500: #c4684a; --amber-400: #e0a64b; --amber-500: #cf8a2b; --sky-400: #5aa9d6; --sky-500: #2f7db8; --moss-500: #7a8b3c;
  --success-500: var(--green-500); --success-50: var(--green-50);
  --warning-500: var(--amber-500); --warning-50: #fcf4e4;
  --danger-500: #c4503a; --danger-50: #fbedea;
  --info-500: var(--sky-500); --info-50: #e9f3fa;

  --text-strong: var(--neutral-900); --text-body: var(--neutral-700); --text-muted: var(--neutral-500); --text-subtle: var(--neutral-400);
  --text-on-brand: #ffffff;
  --surface-page: var(--neutral-50); --surface-card: var(--neutral-0); --surface-sunken: var(--neutral-100); --surface-inverse: var(--green-900);
  --surface-brand-subtle: var(--green-50);
  --border-subtle: var(--neutral-200); --border-default: var(--neutral-300); --border-strong: var(--neutral-400); --border-focus: var(--green-400);
  --action-primary: var(--green-500); --action-primary-hover: var(--green-600); --action-primary-active: var(--green-700); --action-ghost-hover: var(--green-50);
  --ring: 0 0 0 3px color-mix(in srgb, var(--green-400) 45%, transparent);

  /* ---- Samsung blue reskin (overrides brand + neutrals + success/info) ---- */
  --green-50: #eef3fb; --green-100: #dae4f6; --green-200: #b3c6ec; --green-300: #7e9bdc; --green-400: #4767c2;
  --green-500: #1428a0; --green-600: #101f80; --green-700: #0c1863; --green-800: #081046; --green-900: #060c2b;
  --neutral-50: #f6f8fb; --neutral-100: #eceff5; --neutral-200: #dde2ea; --neutral-300: #c2c9d6; --neutral-400: #98a1b2;
  --neutral-500: #6b7484; --neutral-600: #4d5563; --neutral-700: #374050; --neutral-800: #232a36; --neutral-900: #131822;
  --success-500: #1d7a4f; --success-50: #eaf5ef; --info-500: #2f7db8; --info-50: #eaf3fa; --sky-500: #2f7db8;
  --ring: 0 0 0 3px color-mix(in srgb, var(--green-400) 40%, transparent);

  /* ---- typography ---- */
  --font-sans: "Mulish", "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600; --weight-bold: 700; --weight-extrabold: 800;
  --text-2xs: 0.6875rem; --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.125rem;
  --text-xl: 1.375rem; --text-2xl: 1.75rem; --text-3xl: 2.25rem;
  --leading-tight: 1.12; --leading-snug: 1.3; --leading-normal: 1.55; --leading-relaxed: 1.7;
  --tracking-wide: 0.04em;
  --type-caption: var(--weight-medium) var(--text-xs)/1.4 var(--font-sans);
  --type-body: var(--weight-regular) var(--text-md)/var(--leading-normal) var(--font-sans);

  /* ---- spacing ---- */
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem;
  --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;

  /* ---- effects ---- */
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-pill: 999px;
  --shadow-sm: 0 2px 6px rgba(14, 59, 48, 0.07);
  --shadow-md: 0 6px 18px rgba(14, 59, 48, 0.09);
  --shadow-lg: 0 16px 40px rgba(14, 59, 48, 0.12);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --duration-base: 200ms;
  --transition-base: all var(--duration-base) var(--ease-out);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: var(--type-body);
  color: var(--text-body);
  background: var(--surface-page);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
::selection { background: var(--green-200); color: var(--green-900); }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }
button { font-family: var(--font-sans); }
.tabular { font-variant-numeric: tabular-nums; }
.eyebrow { font: var(--type-caption); text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--text-muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== shell ===== */
#app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
#app.auth-mode { display: block; }
.sidebar {
  display: flex; flex-direction: column; gap: var(--space-8);
  background: var(--green-900); padding: var(--space-6) var(--space-4);
}
.brand-row { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-2); }
.brand-mark {
  display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border-radius: 9px; background: var(--green-500); color: #fff; font: var(--weight-extrabold) 13px/1 var(--font-sans); letter-spacing: -0.02em; flex: none;
}
.brand-name { font: var(--weight-bold) var(--text-sm)/1.1 var(--font-sans); color: #fff; letter-spacing: -0.02em; }
.brand-sub { font: var(--weight-medium) 10px/1 var(--font-sans); color: var(--green-300); letter-spacing: 0.08em; text-transform: uppercase; }

.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav-item {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
  min-height: 44px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  cursor: pointer; transition: var(--transition-base); background: transparent; border: none; text-align: left; width: 100%;
}
.side-nav-item:hover { background: rgba(255,255,255,.07); }
.side-nav-item.is-active { background: rgba(255,255,255,.12); }
.side-nav-item .ko { display: block; font: var(--weight-semibold) var(--text-sm)/1.2 var(--font-sans); color: rgba(255,255,255,.72); white-space: nowrap; }
.side-nav-item.is-active .ko { color: #fff; }
.side-nav-item .en { display: block; font: var(--weight-regular) 10px/1 var(--font-sans); color: rgba(255,255,255,.38); white-space: nowrap; }
.side-nav-item.is-active .en { color: var(--green-200); }
.side-nav-item .count { flex: none; font: var(--weight-semibold) 11px/1 var(--font-sans); color: rgba(255,255,255,.38); }
.side-nav-item.is-active .count { color: var(--green-200); }
.side-nav-item.is-soon .ko::after { content: " · 준비중"; font-weight: var(--weight-regular); color: rgba(255,255,255,.4); }

.package-box {
  margin-top: auto; padding: var(--space-4); border-radius: var(--radius-lg); background: rgba(255,255,255,.06);
  display: flex; flex-direction: column; gap: var(--space-2);
}
.package-box .lbl { font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--green-200); letter-spacing: 0.06em; text-transform: uppercase; }
.package-box .big { font: var(--weight-bold) var(--text-lg)/1.2 var(--font-sans); color: #fff; }
.package-box .fine { font: var(--weight-regular) var(--text-xs)/1.5 var(--font-sans); color: var(--green-300); }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-3) var(--space-8); min-height: 64px; background: var(--surface-card); border-bottom: 1px solid var(--border-subtle);
}
.crumbs { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.crumb-root { font: var(--weight-regular) var(--text-sm)/1 var(--font-sans); color: var(--text-muted); white-space: nowrap; }
.crumb-sep { color: var(--text-subtle); }
.crumb-leaf { font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-right { display: flex; align-items: center; gap: var(--space-4); flex: none; }
.who { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.who .name { font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-strong); }
.who .clock { font: var(--weight-regular) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); }

.mobile-nav { display: none; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--surface-card); border-bottom: 1px solid var(--border-subtle); overflow-x: auto; }
.chip {
  display: inline-flex; flex: none; align-items: center; gap: var(--space-2); height: 34px; padding: 0 var(--space-4);
  border-radius: var(--radius-pill); cursor: pointer; font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans);
  border: 1px solid var(--border-subtle); background: var(--surface-card); color: var(--text-body); white-space: nowrap;
}
.chip.is-active { border-color: var(--green-500); background: var(--green-500); color: #fff; }
.chip.is-soon { border-style: dashed; color: var(--text-muted); }

.view { flex: 1; min-width: 0; padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }

/* ===== search input ===== */
.search-wrap { position: relative; display: inline-flex; align-items: center; }
.search-wrap .icon { position: absolute; left: 12px; color: var(--text-subtle); font-size: 14px; pointer-events: none; }
.search-input {
  width: 240px; height: 40px; padding: 0 var(--space-3) 0 34px; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); font: var(--weight-regular) var(--text-sm)/1 var(--font-sans); background: var(--surface-card); color: var(--text-body);
}
.search-input:focus { border-color: var(--border-focus); }

/* ===== buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 var(--space-5);
  border-radius: var(--radius-md); font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); cursor: pointer;
  border: 1px solid transparent; transition: var(--transition-base); white-space: nowrap;
}
.btn-primary { background: var(--action-primary); color: #fff; }
.btn-primary:hover { background: var(--action-primary-hover); }
.btn-secondary { background: var(--surface-card); border-color: var(--border-default); color: var(--text-body); }
.btn-secondary:hover { border-color: var(--border-strong); }
.btn-ghost { background: transparent; color: var(--text-body); }
.btn-ghost:hover { background: var(--action-ghost-hover); }
.btn.full { width: 100%; }

/* ===== card / stat / badge ===== */
.card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.card--pad { padding: var(--space-6); }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border-subtle); }
.card-head .title { font: var(--weight-bold) var(--text-md)/1 var(--font-sans); color: var(--text-strong); }
.card-head .note { font: var(--weight-medium) var(--text-sm)/1 var(--font-sans); color: var(--text-muted); }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
.stat-card { display: flex; flex-direction: column; gap: var(--space-2); justify-content: center; min-height: 132px; padding: var(--space-5) var(--space-6); }
.stat-card .label { font: var(--type-caption); color: var(--text-muted); }
.stat-card .value { font: var(--weight-extrabold) var(--text-2xl)/1.1 var(--font-sans); color: var(--text-strong); }
.stat-card .value .unit { font: var(--weight-semibold) var(--text-md)/1 var(--font-sans); color: var(--text-muted); margin-left: 4px; }
.stat-card .caption { font: var(--weight-regular) var(--text-xs)/1.4 var(--font-sans); color: var(--text-muted); }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: var(--radius-pill); font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); white-space: nowrap; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.badge.tone-success { background: var(--success-50); color: var(--success-500); } .badge.tone-success .dot { background: var(--success-500); }
.badge.tone-warning { background: var(--warning-50); color: var(--warning-500); } .badge.tone-warning .dot { background: var(--warning-500); }
.badge.tone-danger { background: var(--danger-50); color: var(--danger-500); } .badge.tone-danger .dot { background: var(--danger-500); }
.badge.tone-info { background: var(--info-50); color: var(--info-500); } .badge.tone-info .dot { background: var(--info-500); }
.badge.tone-brand { background: var(--surface-brand-subtle); color: var(--green-600); } .badge.tone-brand .dot { background: var(--green-500); }
.badge.tone-neutral { background: var(--neutral-100); color: var(--text-muted); } .badge.tone-neutral .dot { background: var(--text-muted); }

/* ===== filter chips ===== */
.filter-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.filter-chip {
  display: inline-flex; flex: none; align-items: center; height: 32px; padding: 0 var(--space-4);
  border-radius: var(--radius-pill); cursor: pointer; white-space: nowrap; font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans);
  border: 1px solid var(--border-subtle); background: var(--surface-card); color: var(--text-body);
}
.filter-chip.is-active { border-color: var(--green-500); background: var(--green-500); color: #fff; }

/* ===== progress ===== */
.bar-track { height: 6px; border-radius: 999px; background: var(--neutral-100); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; }

.ring-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); text-align: center; }
.ring-wrap .card-head.solo { align-self: flex-start; border-bottom: none; padding: 0; }

/* ===== table ===== */
.table-head, .table-row { display: grid; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); }
.table-head { background: var(--neutral-50); border-bottom: 1px solid var(--border-subtle); font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
.table-row { border-bottom: 1px solid var(--neutral-100); cursor: pointer; transition: var(--transition-base); }
.table-row:hover { background: var(--green-50); }
.table-row:last-child, .table-body > *:last-child .table-row { border-bottom: none; }
.grid-students { grid-template-columns: 1.6fr 1.3fr 0.8fr 1.2fr 1.1fr 1fr; }
.grid-payments { grid-template-columns: 1.5fr 1fr 0.8fr 0.8fr 1.1fr 1.1fr; }
.avatar-init { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--green-100); color: var(--green-700); font: var(--weight-bold) var(--text-xs)/1 var(--font-sans); }

/* ===== lists ===== */
.agenda-row { display: grid; grid-template-columns: 104px 8px 1fr auto; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--neutral-100); cursor: pointer; }
.agenda-row:last-child { border-bottom: none; }
.agenda-row:hover { background: var(--green-50); }
.dot-lg { width: 8px; height: 8px; border-radius: 50%; }

/* ===== alert / toast ===== */
.alert { display: flex; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-radius: var(--radius-md); border: 1px solid; }
.alert.tone-success { background: var(--success-50); border-color: color-mix(in srgb, var(--success-500) 35%, transparent); }
.alert.tone-danger { background: var(--danger-50); border-color: color-mix(in srgb, var(--danger-500) 35%, transparent); }
.alert.tone-info { background: var(--info-50); border-color: color-mix(in srgb, var(--info-500) 35%, transparent); }
.alert .title { font: var(--weight-bold) var(--text-sm)/1.3 var(--font-sans); color: var(--text-strong); }
.alert .body { font: var(--weight-regular) var(--text-sm)/1.5 var(--font-sans); color: var(--text-body); margin-top: 2px; }
.alert .close { margin-left: auto; flex: none; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 16px; line-height: 1; }

.toast-wrap { position: fixed; z-index: 70; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); animation: toastIn 220ms var(--ease-out) both; }
.toast-wrap .card { box-shadow: var(--shadow-lg); }

/* ===== modal ===== */
.modal-backdrop { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: var(--space-6); background: rgba(6,12,43,.42); animation: fadeIn 160ms var(--ease-out) both; }
.modal-box { width: 100%; max-width: 520px; animation: rise 200ms var(--ease-out) both; }
.modal-rows { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); background: var(--neutral-50); border-radius: var(--radius-md); }
.modal-rows .r { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); }
.modal-rows .r .k { font: var(--weight-regular) var(--text-sm)/1.4 var(--font-sans); color: var(--text-muted); }
.modal-rows .r .v { flex: none; font: var(--weight-semibold) var(--text-sm)/1.4 var(--font-sans); color: var(--text-strong); text-align: right; white-space: nowrap; }

.field-label { display: block; font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: var(--space-2); }
.textarea {
  width: 100%; padding: var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  font: var(--weight-regular) var(--text-sm)/1.5 var(--font-sans); color: var(--text-body); background: var(--surface-card); resize: vertical;
}
.textarea:focus { border-color: var(--border-focus); }
.input {
  width: 100%; height: 40px; padding: 0 var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  font: var(--weight-regular) var(--text-sm)/1 var(--font-sans); color: var(--text-body); background: var(--surface-card);
}
.input:focus { border-color: var(--border-focus); }

/* ===== auth ===== */
.auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); background: var(--surface-page); }
.auth-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: var(--space-5); }
.auth-brand { display: flex; align-items: center; justify-content: center; gap: var(--space-3); }
.auth-tabs { display: flex; gap: var(--space-2); padding: 3px; background: var(--surface-sunken); border-radius: var(--radius-md); }
.auth-tab { flex: 1; text-align: center; padding: var(--space-2); border-radius: var(--radius-sm); cursor: pointer; font: var(--weight-semibold) var(--text-sm)/1 var(--font-sans); color: var(--text-muted); }
.auth-tab.is-active { background: var(--surface-card); color: var(--text-strong); box-shadow: var(--shadow-sm); }
.auth-error { font: var(--weight-medium) var(--text-sm)/1.4 var(--font-sans); color: var(--danger-500); }
.auth-hint { text-align: center; font: var(--weight-regular) var(--text-xs)/1.4 var(--font-sans); color: var(--text-subtle); }
.dev-box {
  padding: var(--space-4); border-radius: var(--radius-md); background: var(--warning-50);
  border: 1px solid color-mix(in srgb, var(--warning-500) 35%, transparent);
  font: var(--weight-regular) var(--text-xs)/1.6 var(--font-sans); color: var(--text-body); word-break: break-all;
}
.dev-box a { color: var(--info-500); }

/* ===== misc content ===== */
.field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5) var(--space-6); }
.field-grid-2 { grid-template-columns: 1fr 1fr; }
.field-grid .f .k { display: block; font: var(--weight-semibold) var(--text-xs)/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: var(--space-2); }
.field-grid .f .v { font: var(--weight-medium) var(--text-md)/1.35 var(--font-sans); color: var(--text-strong); }

    fire(r.name + " 님 등록 완료 — 8회차 자동 편성", r.slot + " 슬롯으로 8회차가 배정되고 $" + (PACK * RATE) + " 인보이스가 발행되었습니다.", "success");

  function logLesson() {
    var studentId = state.student, note = state.note;
    state.students = state.students.map(function (st) {
      if (st.id !== studentId) return st;
      var no = st.used + 1;
      var parts = (note || "").split(/[,·/]/).map(function (x) { return x.trim(); }).filter(Boolean);
      var newLesson = {
        no: no, date: "8월 25일 (화)", topic: parts[0] || "자유 대화 50분", attend: "출석", tone: "success",
        pron: parts[1] || "이번 회차 발음 메모 없음",
        vocab: parts[2] || "이번 회차 어휘 메모 없음",
        hw: parts[3] || "다음 수업 전 음성 과제 1건"
      };
      return Object.assign({}, st, { used: Math.min(st.total, no), lessons: [newLesson].concat(st.lessons) });
    });
    var st = state.students.find(function (x) { return x.id === studentId; });
    var left = st ? st.total - Math.min(st.total, st.used) : 0;
    setState({ modal: null, note: "" });
    if (left <= 2) {
      fire("수업 기록 완료 — 잔여 " + left + "회", "잔여 2회 이하입니다. 다음 8회 인보이스를 미리 발행해 보이스톡 일정을 이어가세요.", "warning");
    } else {
      fire("수업 기록 완료 — 잔여 " + left + "회", "학습 기록에 발음·어휘·과제가 저장되었습니다.", "success");
    }
  }

    var studentId = state.student;

    state.invoices = [{ id: "iv" + Date.now(), sid: studentId, period: "2026-09", sessions: PACK, amount: PACK * RATE, status: "pending", method: st ? st.method : "PayPal", issued: "8/25 발행", kind: "정규 8회 패키지" }].concat(state.invoices);
    setState({ modal: null });
    fire("인보이스 발행 — $" + (PACK * RATE), (st ? st.name : "") + " 님에게 9월 8회 패키지 청구서를 보냈습니다. 입금 확인 시 회차가 충전됩니다.", "info");

      '<text x="48" y="53" text-anchor="middle" font-family="var(--font-mono)" font-size="15" font-weight="600" fill="var(--text-strong)">' + esc(label) + '</text>' +

      '<div style="color:var(--text-body)"><strong>' + esc(p.email) + '</strong> 주소로 인증 메일을 보냈습니다. 메일함에서 링크를 클릭하면 가입이 완료되고 자동으로 로그인됩니다.</div>' +
      '<div class="dev-box"><strong>개발 모드 안내</strong> — 실제 메일 서버가 연동되어 있지 않아 지금은 링크를 화면에 직접 표시합니다. 실제 서비스에서는 이 부분이 실제 이메일 발송으로 대체됩니다.<br><br>' +
      '<a href="' + esc(p.devVerifyUrl) + '" target="_blank" rel="noopener">' + esc(p.devVerifyUrl) + '</a></div>' +
      '<button class="btn btn-secondary full" type="button" id="back-to-login">로그인 화면으로 돌아가기</button>' +
      '</div>'
    );
  }

  function renderAuthForm() {
    var tab = state.authTab;
    return authShell(
      '<form id="auth-form" class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-5)">' +
      '<div class="auth-tabs">' +
      '<div class="auth-tab' + (tab === "login" ? " is-active" : "") + '" data-auth-tab="login">로그인</div>' +
      '<div class="auth-tab' + (tab === "signup" ? " is-active" : "") + '" data-auth-tab="signup">회원가입</div>' +
      '</div>' +
      (tab === "signup" ? '<div><label class="field-label">이름</label><input class="input" id="auth-name" type="text" placeholder="선택 입력" autocomplete="name"></div>' : "") +
      '<div><label class="field-label">이메일</label><input class="input" id="auth-email" type="email" required placeholder="example@naver.com" autocomplete="email"></div>' +
      '<div><label class="field-label">비밀번호</label><input class="input" id="auth-password" type="password" required placeholder="8자 이상" autocomplete="' + (tab === "signup" ? "new-password" : "current-password") + '"></div>' +
      (state.authError ? '<div class="auth-error">' + esc(state.authError) + '</div>' : "") +
      (state.authUnverifiedEmail ? '<button type="button" class="btn btn-secondary full" id="resend-btn">인증 메일 다시 받기</button>' : "") +
      '<button class="btn btn-primary full" type="submit" id="auth-submit"' + (state.authBusy ? " disabled" : "") + '>' +
      (state.authBusy ? "처리 중…" : (tab === "signup" ? "회원가입" : "로그인")) + '</button>' +
      (tab === "login" ? '<button type="button" id="forgot-link" style="align-self:center;background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0;font:inherit;text-decoration:underline">비밀번호를 잊으셨나요?</button>' : "") +
      '</form>' +
      '<div class="auth-hint">' + (tab === "signup" ? "회원가입 시 이메일로 인증 링크가 발송되며, 인증을 완료해야 로그인할 수 있습니다." : "계정이 없다면 회원가입 탭에서 새로 만들 수 있습니다.") + '</div>'
    );
  }

  function renderAuthForgot() {
    var f = state.authForgot;
    if (f.stage === "sent") {
      return authShell(
        '<div class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-4)">' +
        '<div style="font:var(--weight-bold) var(--text-md)/1.3 var(--font-sans);color:var(--text-strong)">비밀번호 재설정 링크</div>' +
        '<div style="color:var(--text-body)"><strong>' + esc(f.email) + '</strong> 계정의 비밀번호를 재설정할 수 있는 링크입니다.</div>' +
        '<div class="dev-box"><strong>개발 모드 안내</strong> — 실제 메일 서버가 연동되어 있지 않아 지금은 링크를 화면에 직접 표시합니다. 실제 서비스에서는 이 부분이 실제 이메일 발송으로 대체됩니다.<br><br>' +
        '<a href="' + esc(f.devResetUrl) + '" target="_blank" rel="noopener">' + esc(f.devResetUrl) + '</a></div>' +
        '<button class="btn btn-secondary full" type="button" id="back-to-login">로그인 화면으로 돌아가기</button>' +
        '</div>'
      );
    }
    return authShell(
      '<form id="forgot-form" class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-5)">' +
      '<div style="font:var(--weight-bold) var(--text-md)/1.3 var(--font-sans);color:var(--text-strong)">비밀번호를 잊으셨나요?</div>' +
      '<div style="color:var(--text-muted)">가입하신 이메일을 입력하시면 비밀번호를 새로 설정할 수 있는 링크를 보여드립니다.</div>' +
      '<div><label class="field-label">이메일</label><input class="input" id="forgot-email" type="email" required placeholder="example@naver.com" autocomplete="email"></div>' +
      (state.authForgotError ? '<div class="auth-error">' + esc(state.authForgotError) + '</div>' : "") +
      '<button class="btn btn-primary full" type="submit" id="forgot-submit"' + (state.authForgotBusy ? " disabled" : "") + '>' +
      (state.authForgotBusy ? "처리 중…" : "재설정 링크 받기") + '</button>' +
      '<button class="btn btn-secondary full" type="button" id="back-to-login">로그인 화면으로 돌아가기</button>' +
      '</form>'
    );
  }

  function renderAuthReset() {
    return authShell(
      '<form id="reset-form" class="card card--pad" style="display:flex;flex-direction:column;gap:var(--space-5)">' +
      '<div style="font:var(--weight-bold) var(--text-md)/1.3 var(--font-sans);color:var(--text-strong)">새 비밀번호 설정</div>' +
      '<div><label class="field-label">새 비밀번호</label><input class="input" id="reset-password" type="password" required placeholder="8자 이상" autocomplete="new-password"></div>' +
      (state.authResetError ? '<div class="auth-error">' + esc(state.authResetError) + '</div>' : "") +
      '<button class="btn btn-primary full" type="submit" id="reset-submit"' + (state.authResetBusy ? " disabled" : "") + '>' +
      (state.authResetBusy ? "처리 중…" : "비밀번호 변경") + '</button>' +
      '</form>'
    );
  }

  function renderAuth() {
    if (state.authResetToken) return renderAuthReset();
    if (state.authForgot) return renderAuthForgot();
    return state.authPendingVerify ? renderAuthPending() : renderAuthForm();
  }

  function submitAuth(e) {
    e.preventDefault();
    if (state.authBusy) return;
    var tab = state.authTab;
    var email = document.getElementById("auth-email").value.trim();
    var password = document.getElementById("auth-password").value;
    var nameEl = document.getElementById("auth-name");
    var body = tab === "signup" ? { email: email, password: password, name: nameEl ? nameEl.value.trim() : "" } : { email: email, password: password };
    setState({ authBusy: true, authError: "", authUnverifiedEmail: "" });
    fetch(tab === "signup" ? "/api/signup" : "/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) {
          setState({ authBusy: false, authError: r.data.error || "요청에 실패했습니다.", authUnverifiedEmail: r.data.unverified ? email : "" });
          return;
        }
        if (tab === "signup" && r.data.pendingVerification) {
          setState({ authBusy: false, authError: "", authPendingVerify: { email: r.data.email, devVerifyUrl: r.data.devVerifyUrl } });
          return;
        }
        setState({ authBusy: false, authError: "", auth: r.data.user });
        fire("로그인 완료", (r.data.user.name || r.data.user.email) + " 님, 환영합니다.", "success");
      })
      .catch(function () { setState({ authBusy: false, authError: "서버에 연결할 수 없습니다." }); });
  }

  function resendVerification() {
    var email = state.authUnverifiedEmail;
    if (!email) return;
    fetch("/api/resend-verification", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ authError: r.data.error || "재발송에 실패했습니다." }); return; }
        setState({ authError: "", authUnverifiedEmail: "", authPendingVerify: { email: email, devVerifyUrl: r.data.devVerifyUrl } });
      })
      .catch(function () { setState({ authError: "서버에 연결할 수 없습니다." }); });
  }

  function submitForgot(e) {
    e.preventDefault();
    if (state.authForgotBusy) return;
    var email = document.getElementById("forgot-email").value.trim();
    setState({ authForgotBusy: true, authForgotError: "" });
    fetch("/api/forgot-password", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ authForgotBusy: false, authForgotError: r.data.error || "요청에 실패했습니다." }); return; }
        setState({ authForgotBusy: false, authForgotError: "", authForgot: { stage: "sent", email: r.data.email, devResetUrl: r.data.devResetUrl } });
      })
      .catch(function () { setState({ authForgotBusy: false, authForgotError: "서버에 연결할 수 없습니다." }); });
  }

  function submitReset(e) {
    e.preventDefault();
    if (state.authResetBusy) return;
    var password = document.getElementById("reset-password").value;
    setState({ authResetBusy: true, authResetError: "" });
    fetch("/api/reset-password", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: state.authResetToken, password: password })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) { setState({ authResetBusy: false, authResetError: r.data.error || "요청에 실패했습니다." }); return; }
        setState({ authResetBusy: false, authResetError: "", authResetToken: null, auth: r.data.user });
        fire("비밀번호 변경 완료", "새 비밀번호로 로그인되었습니다.", "success");
      })
      .catch(function () { setState({ authResetBusy: false, authResetError: "서버에 연결할 수 없습니다." }); });
  }

  function doLogout() {
    fetch("/api/logout", { method: "POST" }).then(function () { setState({ auth: null, view: "dash", modal: null }); });
  }

  function bindAuthEvents() {
    var root = document.getElementById("app");
    root.querySelectorAll("[data-auth-tab]").forEach(function (el) {
      el.addEventListener("click", function () { setState({ authTab: el.getAttribute("data-auth-tab"), authError: "", authUnverifiedEmail: "" }); });
    });
    var form = document.getElementById("auth-form");
    if (form) form.addEventListener("submit", submitAuth);
    var resendBtn = document.getElementById("resend-btn");
    if (resendBtn) resendBtn.addEventListener("click", resendVerification);
    var forgotLink = document.getElementById("forgot-link");
    if (forgotLink) forgotLink.addEventListener("click", function () { setState({ authForgot: { stage: "email" }, authForgotError: "" }); });
    var forgotForm = document.getElementById("forgot-form");
    if (forgotForm) forgotForm.addEventListener("submit", submitForgot);
    var resetForm = document.getElementById("reset-form");
    if (resetForm) resetForm.addEventListener("submit", submitReset);
    var backBtn = document.getElementById("back-to-login");
    if (backBtn) backBtn.addEventListener("click", function () { setState({ authPendingVerify: null, authForgot: null, authTab: "login" }); });
  }

  function render() {
    var appEl = document.getElementById("app");

    if (!state.authReady) {
      appEl.className = "auth-mode";
      appEl.innerHTML = "";
      return;
    }
    if (!state.auth) {
      appEl.className = "auth-mode";
      appEl.innerHTML = renderAuth() + renderToast();
      bindAuthEvents();
      var closeToast = document.querySelector("[data-close-toast]");
      if (closeToast) closeToast.addEventListener("click", function () { clearTimeout(toastTimer); setState({ toast: null }); });
      var emailInput = document.getElementById("auth-email");
      if (emailInput) emailInput.focus();
      return;
    }

    appEl.className = "";
    var hadFocus = document.activeElement && document.activeElement.id === "query-input";
    var st = state.students.find(function (x) { return x.id === state.student; }) || state.students[0];
    var body;
    if (state.view === "requests") body = renderRequests();
    else if (state.view === "students") body = renderStudents();
    else if (state.view === "student") body = renderStudent();
    else if (state.view === "payments") body = renderPayments();
    else if (state.view === "materials") body = renderMaterials();
    else body = renderDash();

    var mm = state.modal ? modalMap(st)[state.modal] : null;
    lastConfirm = mm ? mm.confirm : null;

    appEl.innerHTML =
      sidebarHtml() +
      '<div class="main">' + topbarHtml(st) + '<div class="view">' + body + '</div></div>' +
      renderModal() + renderToast();

    bindEvents();
    if (hadFocus) {
      var qi = document.getElementById("query-input");
      if (qi) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
    }
  }

  function bindEvents() {
    var root = document.getElementById("app");
    root.querySelectorAll("[data-nav]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); go(el.getAttribute("data-nav")); });
    });
    root.querySelectorAll("[data-goto-student]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); go("student", el.getAttribute("data-goto-student")); });
    });
    root.querySelectorAll("[data-filter]").forEach(function (el) {
      el.addEventListener("click", function () { setState({ filter: el.getAttribute("data-filter") }); });
    });
    root.querySelectorAll("[data-payfilter]").forEach(function (el) {
      el.addEventListener("click", function () { setState({ payFilter: el.getAttribute("data-payfilter") }); });
    });
    root.querySelectorAll("[data-approve]").forEach(function (el) {
      el.addEventListener("click", function () {
        pendingRequest = state.requests.find(function (r) { return r.id === el.getAttribute("data-approve"); });
        setState({ modal: "approve" });
      });
    });
    root.querySelectorAll("[data-open-modal]").forEach(function (el) {
      el.addEventListener("click", function () { setState({ modal: el.getAttribute("data-open-modal"), note: "" }); });
    });
    root.querySelectorAll("[data-close-modal]").forEach(function (el) {
      el.addEventListener("click", function () { setState({ modal: null, note: "" }); });
    });
    root.querySelectorAll("[data-stop]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); });
    });
    var modalConfirmBtn = document.getElementById("modal-confirm");
    if (modalConfirmBtn) modalConfirmBtn.addEventListener("click", function () { if (lastConfirm) lastConfirm(); });
    var noteInput = document.getElementById("lesson-note");
    if (noteInput) noteInput.addEventListener("input", function () { state.note = noteInput.value; });
    root.querySelectorAll("[data-confirm-payment]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); confirmPayment(el.getAttribute("data-confirm-payment")); });
    });
    root.querySelectorAll("[data-notyet]").forEach(function (el) {
      el.addEventListener("click", function () { notYet(); });
    });
    var logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) logoutBtn.addEventListener("click", doLogout);
    var materialForm = document.getElementById("material-upload-form");
    if (materialForm) materialForm.addEventListener("submit", submitMaterialUpload);
    root.querySelectorAll("[data-del-material]").forEach(function (el) {
      el.addEventListener("click", function () { deleteMaterialById(parseInt(el.getAttribute("data-del-material"), 10)); });
    });
    root.querySelectorAll("[data-close-toast]").forEach(function (el) {
      el.addEventListener("click", function () { clearTimeout(toastTimer); setState({ toast: null }); });
    });
    var qi = document.getElementById("query-input");
    if (qi) qi.addEventListener("input", function () { state.query = qi.value; render(); });
  }

  var resetTokenMatch = location.search.match(/(?:^|[?&])resetToken=([^&]+)/);
  if (resetTokenMatch) {
    state.authResetToken = decodeURIComponent(resetTokenMatch[1]);
    history.replaceState(null, "", location.pathname);
  }
  render();
  var justVerified = /(?:^|[?&])verified=1(?:&|$)/.test(location.search);
  if (justVerified) history.replaceState(null, "", location.pathname);

  fetch("/api/me")
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      state.auth = data ? data.user : null;
      state.authReady = true;
      render();
      if (justVerified && state.auth) {
        fire("이메일 인증 완료", "인증이 완료되어 자동으로 로그인되었습니다.", "success");
      }
    })
    .catch(function () { state.authReady = true; render(); });

  setInterval(function () {
    var clockEl = document.querySelector(".who .clock");
    if (clockEl) clockEl.textContent = clockText();
  }, 30000);
})();
</script>
</body>
</html>
