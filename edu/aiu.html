<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>AI 시대, 명예훼손 예방교육 (강의 시연 교안)</title>
<style>
  @page {
    size: A4 portrait;
    margin: 15mm;
  }
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: #1F2937;
    background-color: #F3F4F6;
    margin: 0;
    padding: 20px;
    line-height: 1.7;
    font-size: 16px;
  }

  /* 🔒 비밀번호 잠금 화면 스타일 */
  #lock-screen {
    max-width: 450px;
    margin: 80px auto;
    background-color: #FFFFFF;
    border: 2px solid #C7D2FE;
    border-radius: 12px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }
  #lock-screen h2 {
    margin: 0 0 10px 0;
    font-size: 22px;
    color: #1E1B4B;
  }
  #lock-screen p {
    font-size: 14.5px;
    color: #6B7280;
    margin-bottom: 20px;
  }
  .input-group {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }
  #pwd-input {
    width: 60%;
    padding: 10px 14px;
    font-size: 16px;
    border: 2px solid #D1D5DB;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  #pwd-input:focus {
    border-color: #4F46E5;
  }
  #unlock-btn {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
    background-color: #4F46E5;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  #unlock-btn:hover {
    background-color: #4338CA;
  }
  #error-msg {
    color: #DC2626;
    font-size: 13.5px;
    font-weight: 600;
    display: none;
    margin-top: 5px;
  }

  /* 📄 교안 본문 영역 (초기 숨김) */
  #main-content {
    display: none;
    max-width: 860px;
    margin: 0 auto;
  }

  .header-box {
    background-color: #FEF2F2;
    border: 2px solid #FCA5A5;
    border-radius: 12px;
    padding: 26px 20px;
    text-align: center;
    margin-bottom: 22px;
  }
  .header-badge {
    background-color: #DC2626;
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 8px;
  }
  .header-box h1 {
    margin: 6px 0;
    font-size: 27px;
    color: #7F1D1D;
  }
  .header-box p {
    margin: 0;
    font-size: 15px;
    color: #991B1B;
    font-weight: 600;
  }

  .section {
    background-color: #FFFFFF;
    border: 2px solid #E5E7EB;
    border-radius: 14px;
    padding: 26px;
    margin-bottom: 22px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.04);
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 900;
    color: #1F2937;
    background-color: #F3F4F6;
    border-left: 7px solid #DC2626;
    padding: 10px 14px;
    border-radius: 6px;
    margin: 0 0 16px 0;
  }
  .section p {
    margin: 0 0 12px 0;
    color: #374151;
  }
  .section p:last-child {
    margin-bottom: 0;
  }

  .callout {
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 14.5px;
    margin: 14px 0;
  }
  .callout.warn {
    background-color: #FFFBEB;
    border-left: 5px solid #F59E0B;
    color: #92400E;
  }
  .callout.info {
    background-color: #EFF6FF;
    border-left: 5px solid #3B82F6;
    color: #1E40AF;
  }
  .callout.danger {
    background-color: #FEF2F2;
    border-left: 5px solid #DC2626;
    color: #991B1B;
  }
  .callout.safe {
    background-color: #F0FDF4;
    border-left: 5px solid #22C55E;
    color: #166534;
  }
  .callout b { color: inherit; }

  .req-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 14px 0;
  }
  .req-card {
    background-color: #F9FAFB;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .req-card .req-title {
    font-weight: 800;
    color: #1F2937;
    font-size: 15.5px;
    margin-bottom: 4px;
  }
  .req-card .req-desc {
    font-size: 14px;
    color: #6B7280;
  }

  table.law-table {
    width: 100%;
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 14.5px;
  }
  table.law-table th, table.law-table td {
    border: 1px solid #E5E7EB;
    padding: 10px 12px;
    text-align: left;
  }
  table.law-table th {
    background-color: #F3F4F6;
    color: #1F2937;
    font-weight: 800;
  }
  table.law-table td.emph {
    font-weight: 800;
    color: #B91C1C;
  }

  .video-card {
    border: 1.5px solid #E5E7EB;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .video-card .video-label {
    display: inline-block;
    background-color: #1E1B4B;
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .video-card h3 {
    margin: 4px 0 10px 0;
    font-size: 17.5px;
    color: #1F2937;
  }
  .video-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    margin-bottom: 12px;
  }
  .video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .video-desc {
    font-size: 14.5px;
    color: #4B5563;
    margin-bottom: 10px;
  }
  .discuss-box {
    background-color: #F5F3FF;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14.5px;
    color: #4C1D95;
  }
  .discuss-box .discuss-title {
    font-weight: 800;
    margin-bottom: 6px;
    display: block;
  }
  .discuss-box ul {
    margin: 0;
    padding-left: 18px;
  }
  .discuss-box li {
    margin-bottom: 4px;
  }

  .checklist {
    list-style: none;
    margin: 14px 0 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .checklist li {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background-color: #F9FAFB;
    border-radius: 10px;
    padding: 13px 15px;
  }
  .checklist .chk-num {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background-color: #DC2626;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .checklist .chk-text {
    font-size: 15.5px;
    color: #111827;
    padding-top: 3px;
  }
  .checklist .chk-text b { color: #7F1D1D; }

  .summary-box {
    background-color: #1E1B4B;
    color: #E0E7FF;
    border-radius: 14px;
    padding: 24px 26px;
    margin-bottom: 10px;
  }
  .summary-box h2 {
    color: #fff;
    font-size: 19px;
    margin: 0 0 12px 0;
  }
  .summary-box ul {
    margin: 0;
    padding-left: 20px;
  }
  .summary-box li {
    margin-bottom: 8px;
    font-size: 15px;
  }
  .footer-msg {
    text-align: center;
    padding: 18px 10px;
    color: #6B7280;
    font-size: 13.5px;
  }

  @media (max-width: 560px) {
    .req-grid { grid-template-columns: 1fr; }
    table.law-table { font-size: 13px; }
    .header-box h1 { font-size: 22px; }
  }

  /* 💬 댓글 영역 스타일 */
  .comment-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .comment-form input[type="text"] {
    width: 100%;
    max-width: 260px;
    padding: 10px 12px;
    font-size: 15px;
    border: 2px solid #D1D5DB;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .comment-form textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px 14px;
    font-size: 15px;
    border: 2px solid #D1D5DB;
    border-radius: 8px;
    outline: none;
    resize: vertical;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .comment-form input[type="text"]:focus,
  .comment-form textarea:focus {
    border-color: #4F46E5;
  }
  .comment-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .comment-char-count {
    font-size: 13px;
    color: #9CA3AF;
  }
  .comment-char-count.limit {
    color: #DC2626;
    font-weight: 700;
  }
  .comment-submit-btn {
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 700;
    color: #FFFFFF;
    background-color: #4F46E5;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .comment-submit-btn:hover { background-color: #4338CA; }
  .comment-submit-btn:disabled { background-color: #A5B4FC; cursor: not-allowed; }
  .comment-error {
    color: #DC2626;
    font-size: 13.5px;
    font-weight: 600;
    display: none;
  }
  .comment-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .comment-item {
    background-color: #F9FAFB;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .comment-item-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }
  .comment-name {
    font-weight: 800;
    color: #1F2937;
    font-size: 15px;
  }
  .comment-date {
    font-size: 12.5px;
    color: #9CA3AF;
    white-space: nowrap;
  }
  .comment-content {
    font-size: 14.5px;
    color: #374151;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .comment-empty {
    color: #9CA3AF;
    font-size: 14.5px;
    text-align: center;
    padding: 10px 0;
  }
</style>
</head>
<body>

<div id="lock-screen">
  <h2>🔒 강의 교안 열람 인증</h2>
  <p>교안을 열람하시려면 비밀번호를 입력해 주세요.</p>
  <div class="input-group">
    <input type="password" id="pwd-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkPassword()">
    <button id="unlock-btn" onclick="checkPassword()">확인</button>
  </div>
  <div id="error-msg">비밀번호가 올바르지 않습니다. 다시 시도해 주세요.</div>
</div>

<div id="main-content">
</div>

<script>
  const LESSON_PAGE = 'aiu';

  function revealContent(html) {
    document.getElementById('main-content').innerHTML = html;
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    initComments();
  }

  async function tryAutoUnlock() {
    try {
      const res = await fetch('/api/lesson-content?page=' + LESSON_PAGE, { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      revealContent(data.html);
    } catch (err) {
      // 자동 인증 실패는 무시하고 잠금 화면을 그대로 둔다.
    }
  }

  async function checkPassword() {
    const input = document.getElementById('pwd-input').value;
    const errorMsg = document.getElementById('error-msg');
    const unlockBtn = document.getElementById('unlock-btn');
    errorMsg.style.display = 'none';
    unlockBtn.disabled = true;
    try {
      const authRes = await fetch('/api/lesson-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ page: LESSON_PAGE, password: input })
      });
      if (!authRes.ok) {
        errorMsg.textContent = '비밀번호가 올바르지 않습니다. 다시 시도해 주세요.';
        errorMsg.style.display = 'block';
        document.getElementById('pwd-input').focus();
        return;
      }
      const contentRes = await fetch('/api/lesson-content?page=' + LESSON_PAGE, { credentials: 'same-origin' });
      if (!contentRes.ok) {
        errorMsg.textContent = '콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
        errorMsg.style.display = 'block';
        return;
      }
      const data = await contentRes.json();
      revealContent(data.html);
    } catch (err) {
      errorMsg.textContent = '오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
      errorMsg.style.display = 'block';
    } finally {
      unlockBtn.disabled = false;
    }
  }

  /* 💬 댓글 기능 */
  const COMMENT_PAGE = 'aiu';

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
  }

  function formatCommentDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderComments(comments) {
    const list = document.getElementById('comment-list');
    if (!comments || comments.length === 0) {
      list.innerHTML = '<div class="comment-empty">아직 등록된 댓글이 없습니다. 첫 댓글을 남겨보세요.</div>';
      return;
    }
    list.innerHTML = comments.map(function (c) {
      return '<div class="comment-item">' +
        '<div class="comment-item-head">' +
        '<span class="comment-name">' + escapeHtml(c.name) + '</span>' +
        '<span class="comment-date">' + formatCommentDate(c.created_at) + '</span>' +
        '</div>' +
        '<div class="comment-content">' + escapeHtml(c.content) + '</div>' +
        '</div>';
    }).join('');
  }

  function loadComments() {
    fetch('/api/comments?page=' + encodeURIComponent(COMMENT_PAGE))
      .then(function (res) { return res.json(); })
      .then(function (data) { renderComments(data.comments || []); })
      .catch(function () {
        document.getElementById('comment-list').innerHTML = '<div class="comment-empty">댓글을 불러오지 못했습니다.</div>';
      });
  }

  function updateCharCount() {
    const val = document.getElementById('comment-content').value;
    const countEl = document.getElementById('comment-char-count');
    countEl.textContent = val.length + ' / 500';
    countEl.className = 'comment-char-count' + (val.length >= 500 ? ' limit' : '');
  }

  function submitComment() {
    const nameInput = document.getElementById('comment-name');
    const contentInput = document.getElementById('comment-content');
    const errorEl = document.getElementById('comment-error');
    const btn = document.getElementById('comment-submit-btn');
    const name = nameInput.value.trim();
    const content = contentInput.value.trim();
    errorEl.style.display = 'none';

    if (!name) {
      errorEl.textContent = '이름(실명)을 입력해 주세요.';
      errorEl.style.display = 'block';
      nameInput.focus();
      return;
    }
    if (!content) {
      errorEl.textContent = '댓글 내용을 입력해 주세요.';
      errorEl.style.display = 'block';
      contentInput.focus();
      return;
    }
    if (content.length > 500) {
      errorEl.textContent = '댓글은 500자 이내로 작성해 주세요.';
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    fetch('/api/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: COMMENT_PAGE, name: name, content: content })
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        btn.disabled = false;
        if (!result.ok) {
          errorEl.textContent = (result.data && result.data.error) || '댓글 등록에 실패했습니다.';
          errorEl.style.display = 'block';
          return;
        }
        nameInput.value = '';
        contentInput.value = '';
        updateCharCount();
        loadComments();
      })
      .catch(function () {
        btn.disabled = false;
        errorEl.textContent = '댓글 등록 중 오류가 발생했습니다.';
        errorEl.style.display = 'block';
      });
  }

  function initComments() {
    document.getElementById('comment-content').addEventListener('input', updateCharCount);
    loadComments();
  }

  tryAutoUnlock();
</script>

</body>
</html>
