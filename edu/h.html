<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>세이스강 안심 건강 &amp; 복약 알리미</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: #0b0f19; color: #FFFFFF; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; padding: 20px; font-size: 24px; line-height: 1.5; }
  .container { max-width: 650px; margin: 0 auto; }
  .profile-header { background: linear-gradient(135deg, #1e1b4b, #172554); border: 4px solid #38bdf8; border-radius: 28px; padding: 22px; display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
  .routine-card { border-radius: 24px; padding: 22px; margin-bottom: 25px; border: 5px solid; background-color: #131c31; }
  .btn-check { width: 100%; min-height: 85px; font-size: 30px; font-weight: 900; border-radius: 18px; cursor: pointer; margin-top: 8px; }
  .input-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  input[type="number"] { width: 100px; height: 50px; font-size: 24px; text-align: center; border-radius: 10px; border: none; }
  .med-toggle { display: flex; gap: 20px; }
  .btn-med { flex: 1; height: 60px; font-size: 24px; border-radius: 12px; border: 2px solid #38bdf8; background: transparent; color: white; cursor: pointer; }
  @media print { body { background: white; color: black; padding: 0; } .no-print { display: none; } .print-only { display: block; } .a4-page { width: 210mm; height: 297mm; padding: 20mm; margin: 0 auto; border: 1px solid #ccc; } }
  .print-only { display: none; }
</style>
</head>
<body>
<div class="container no-print" id="main-content">
  <div class="profile-header">
    <div class="profile-info"><div class="profile-title">세이스강 건강 알리미</div></div>
  </div>
  <div class="routine-card" style="border-color: #38bdf8;">
    <div>아침 혈압 (mmHg)</div>
    <div class="input-group">
      <input type="number" placeholder="수축기"> / <input type="number" placeholder="이완기">
    </div>
    <div style="margin-top: 15px;">오늘의 체중 (kg)</div>
    <input type="number" step="0.1" placeholder="00.0">
    <div style="margin-top: 15px;">복약 여부</div>
    <div class="med-toggle">
      <button class="btn-med">O (복용)</button>
      <button class="btn-med">X (미복용)</button>
    </div>
  </div>
  <button class="btn-check" style="background-color: #0284c7; color: white;" onclick="window.print()">📄 병원 제출용 A4 출력하기</button>
</div>
<div class="print-only a4-page">
  <h1 style="text-align: center; margin-bottom: 30px;">주간 건강 및 복약 기록지</h1>
  <table style="width: 100%; border-collapse: collapse; margin-top: 20px;" border="1">
    <tr><th>날짜</th><th>아침 혈압</th><th>체중</th><th>복약 여부</th><th>저녁 혈압</th></tr>
    <tr><td> </td><td> </td><td> </td><td> </td><td> </td></tr>
  </table>
</div>
</body>
</html>
