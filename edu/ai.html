<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>생성형 AI로 자서전 쓰기 & 말벗 되기 (10분 강의 시연 교안)</title>
<style>
  @page {
    size: A4 portrait;
    margin: 15mm;
  }
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: #1F2937;
    background-color: #F3F4F6;
    margin: 0;
    padding: 20px;
    line-height: 1.6;
    font-size: 16px;
  }

  /* 🔒 비밀번호 잠금 화면 스타일 */
  #lock-screen {
    max-width: 450px;
    margin: 80px auto;
    background-color: #FFFFFF;
    border: 2px solid #C7D2FE;
    border-radius: 12px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }
  #lock-screen h2 {
    margin: 0 0 10px 0;
    font-size: 22px;
    color: #1E1B4B;
  }
  #lock-screen p {
    font-size: 14.5px;
    color: #6B7280;
    margin-bottom: 20px;
  }
  .input-group {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }
  #pwd-input {
    width: 60%;
    padding: 10px 14px;
    font-size: 16px;
    border: 2px solid #D1D5DB;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  #pwd-input:focus {
    border-color: #4F46E5;
  }
  #unlock-btn {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
    background-color: #4F46E5;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  #unlock-btn:hover {
    background-color: #4338CA;
  }
  #error-msg {
    color: #DC2626;
    font-size: 13.5px;
    font-weight: 600;
    display: none;
    margin-top: 5px;
  }

  /* 📄 교안 본문 영역 (초기 숨김) */
  #main-content {
    display: none;
    max-width: 820px;
    margin: 0 auto;
    background-color: #FFFFFF;
    border: 2px solid #E5E7EB;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  }

  .header-box {
    background-color: #EEF2FF;
    border: 2px solid #C7D2FE;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    margin-bottom: 25px;
  }
  .header-badge {
    background-color: #4F46E5;
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 8px;
  }
  .header-box h1 {
    margin: 6px 0;
    font-size: 26px;
    color: #1E1B4B;
  }
  .header-info {
    font-size: 14.5px;
    color: #4338CA;
    margin: 0;
    font-weight: 600;
  }
  .img-box {
    text-align: center;
    margin: 20px 0;
    padding: 10px;
    background-color: #FAFAFA;
    border: 1px dashed #D1D5DB;
    border-radius: 8px;
  }
  .img-box img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
  }
  .img-caption {
    font-size: 13px;
    color: #6B7280;
    margin-top: 6px;
  }
  .link-card {
    background-color: #F8FAFC;
    border: 1.5px solid #E2E8F0;
    border-left: 5px solid #3B82F6;
    padding: 14px 16px;
    border-radius: 6px;
    margin: 15px 0 25px 0;
    font-size: 15px;
  }
  .link-card a {
    color: #2563EB;
    font-weight: 700;
    text-decoration: none;
  }
  .link-card a:hover {
    text-decoration: underline;
  }
  .section-title {
    font-size: 20px;
    font-weight: 800;
    color: #1E1B4B;
    border-bottom: 2px solid #E5E7EB;
    padding-bottom: 8px;
    margin-top: 30px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .addie-box {
    background-color: #F8FAFC;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    padding: 14px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .addie-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    text-align: center;
  }
  .addie-item {
    background-color: #FFFFFF;
    border: 1px solid #E2E8F0;
    padding: 8px;
    border-radius: 6px;
  }
  .addie-item strong {
    display: block;
    color: #4F46E5;
    font-size: 13px;
  }
  .diagram-container {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 15px 0;
  }
  .diagram-step {
    flex: 1;
    background-color: #F9FAFB;
    border: 1.5px solid #E5E7EB;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .diagram-step .icon {
    font-size: 24px;
    margin-bottom: 4px;
  }
  .diagram-step .step-title {
    font-weight: 700;
    color: #1F2937;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .diagram-step .step-desc {
    font-size: 13px;
    color: #4B5563;
  }

  /* 🎬 동영상 영역 */
  .video-container {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    max-width: 100%;
    border-radius: 8px;
    margin: 15px 0 10px 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    background-color: #000;
  }
  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .video-direct-btn {
    text-align: center;
    margin-bottom: 20px;
  }
  .video-direct-btn a {
    display: inline-block;
    background-color: #EF4444;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 6px;
    text-decoration: none;
  }
  .video-direct-btn a:hover {
    background-color: #DC2626;
  }

  .quote-box {
    background-color: #FFFBEB;
    border-left: 4px solid #F59E0B;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 15px;
    color: #92400E;
    font-weight: 600;
    margin: 15px 0;
  }
  .result-banner {
    background-color: #F0FDF4;
    border: 2px solid #BBF7D0;
    border-radius: 8px;
    padding: 16px;
    margin: 20px 0;
    text-align: center;
  }
  .result-banner a {
    display: inline-block;
    background-color: #16A34A;
    color: #FFFFFF;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 6px;
    text-decoration: none;
    margin-top: 8px;
  }
  .faq-box {
    background-color: #F9FAFB;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .faq-q {
    font-weight: 700;
    color: #1F2937;
    margin-bottom: 4px;
  }
  .faq-a {
    color: #4B5563;
    font-size: 14.5px;
  }
  .footer-msg {
    background-color: #1E1B4B;
    color: #FFFFFF;
    border-radius: 8px;
    padding: 18px;
    text-align: center;
    margin-top: 25px;
  }
  .footer-msg p {
    margin: 4px 0;
  }
  @media print {
    body { background-color: #FFFFFF; padding: 0; }
    #lock-screen { display: none !important; }
    #main-content { display: block !important; border: none; box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>

<!-- 🔒 비밀번호 입력 박스 -->
<div id="lock-screen">
  <div style="font-size: 36px; margin-bottom: 10px;">🔐</div>
  <h2>강의 교안 열람 인증</h2>
  <p>교안을 열람하시려면 비밀번호를 입력해 주세요.</p>
  
  <div class="input-group">
    <input type="password" id="pwd-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkPassword()">
    <button id="unlock-btn" onclick="checkPassword()">확인</button>
  </div>
  <div id="error-msg">⚠️ 비밀번호가 일치하지 않습니다. 다시 입력해 주세요.</div>
</div>

<!-- 📄 비밀번호 확인 후 표시될 교안 본문 -->
<div id="main-content" class="container">
</div>

<!-- 🔑 비밀번호 검증 스크립트 -->
<script>
  const LESSON_PAGE = 'ai';

  function revealContent(html) {
    document.getElementById('main-content').innerHTML = html;
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
  }

  async function tryAutoUnlock() {
    try {
      const res = await fetch('/api/lesson-content?page=' + LESSON_PAGE, { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      revealContent(data.html);
    } catch (err) {
      // 자동 인증 실패는 무시하고 잠금 화면을 그대로 둔다.
    }
  }

  async function checkPassword() {
    const input = document.getElementById('pwd-input').value;
    const errorMsg = document.getElementById('error-msg');
    const unlockBtn = document.getElementById('unlock-btn');
    errorMsg.style.display = 'none';
    unlockBtn.disabled = true;
    try {
      const authRes = await fetch('/api/lesson-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ page: LESSON_PAGE, password: input })
      });
      if (!authRes.ok) {
        errorMsg.textContent = '비밀번호가 올바르지 않습니다. 다시 시도해 주세요.';
        errorMsg.style.display = 'block';
        document.getElementById('pwd-input').focus();
        return;
      }
      const contentRes = await fetch('/api/lesson-content?page=' + LESSON_PAGE, { credentials: 'same-origin' });
      if (!contentRes.ok) {
        errorMsg.textContent = '콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
        errorMsg.style.display = 'block';
        return;
      }
      const data = await contentRes.json();
      revealContent(data.html);
    } catch (err) {
      errorMsg.textContent = '오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
      errorMsg.style.display = 'block';
    } finally {
      unlockBtn.disabled = false;
    }
  }

  tryAutoUnlock();
</script>

</body>
</html>
