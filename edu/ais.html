<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디지털 자서전과 내 삶의 노래 만들기 | 시니어 AI 체험 교육</title>
<meta name="description" content="시니어를 위한 4시간 AI 체험 교육 - QR 친구 맺기, AI 캐릭터, 자서전 인포그래픽, 시화와 노래 만들기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFDF9;
    --ground:#F3ECE0;
    --ink:#2A2420;
    --ink-soft:#5C5248;
    --teal:#0F766E;      --teal-bg:#CCFBF1;
    --purple:#5B4B8A;    --purple-bg:#E6E1F5;
    --amber:#B45309;     --amber-bg:#FEF3C7;
    --rose:#BE185D;      --rose-bg:#FCE7F3;
    --line:#E7DFCF;
    --shadow: 0 10px 30px rgba(60,45,20,0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.75;
    font-size:19px;
    -webkit-font-smoothing:antialiased;
  }
  .headfont{font-family:"Gowun Batang","Noto Sans KR",serif;}

  /* 상단 안내 바 */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(255,253,249,0.92);
    backdrop-filter: blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    flex-wrap:wrap;
  }
  .topbar a{
    font-size:15px; font-weight:700; text-decoration:none;
    color:var(--ink); padding:8px 14px; border-radius:999px;
    border:2px solid var(--line); background:#fff;
    white-space:nowrap;
  }
  .topbar a:hover{border-color:var(--teal); color:var(--teal);}
  .topbar button{
    font-size:15px; font-weight:700; padding:8px 16px; border-radius:999px;
    border:2px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer;
  }

  .page{
    width:210mm;
    min-height:297mm;
    max-width:94vw;
    margin:28px auto;
    padding:16mm 15mm;
    background:var(--paper);
    box-shadow:var(--shadow);
    border-radius:10px;
    position:relative;
  }
  .page + .page{ margin-top:36px; }

  .badge-org{
    display:inline-block; font-size:14px; font-weight:700; color:var(--ink-soft);
    background:#fff; border:2px solid var(--line); border-radius:999px;
    padding:6px 16px; margin-top:18px;
  }

  h1.title{
    font-size:44px; margin:10px 0 6px; line-height:1.3;
  }
  h2.subtitle{
    font-size:22px; font-weight:500; color:var(--ink-soft); margin:0 0 20px;
  }
  .hero-wrap{ margin:26px 0; text-align:center; }
  .hero-wrap svg{ width:100%; max-width:720px; height:auto; }
  .lead{ font-size:20px; color:var(--ink-soft); max-width:640px; }

  table.schedule{
    width:100%; border-collapse:collapse; margin-top:22px; font-size:17px;
  }
  table.schedule th, table.schedule td{
    border:1px solid var(--line); padding:12px 14px; text-align:left;
  }
  table.schedule th{ background:#FBF4E4; font-weight:700; }
  table.schedule tr:nth-child(even) td{ background:#FBF8F1; }

  .prep-note{
    margin-top:22px; padding:16px 18px; border-radius:12px;
    background:#FBF4E4; border:1px dashed #D9C79A; font-size:17px;
  }

  /* 부(part) 페이지 */
  .part-page{ border-top:10px solid var(--part-color, var(--teal)); }
  .part-icon{ text-align:center; margin-bottom:8px; }
  .part-icon svg{ width:150px; height:150px; }
  .part-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:50%;
    background:var(--part-color, var(--teal)); color:#fff;
    font-weight:900; font-size:20px; margin-right:12px; flex:none;
  }
  h1.part-title{
    font-size:34px; text-align:center; margin:6px 0 4px;
  }
  .part-lead{
    text-align:center; color:var(--ink-soft); font-size:19px;
    max-width:620px; margin:0 auto 26px;
  }
  h3.section-h{
    font-size:21px; margin:26px 0 14px; color:var(--part-color, var(--teal));
  }
  ol.steps{ list-style:none; margin:0; padding:0; counter-reset:step; }
  ol.steps > li{
    counter-increment: step;
    display:flex; align-items:flex-start; gap:14px;
    padding:14px 4px; border-bottom:1px dashed var(--line);
  }
  ol.steps > li:last-child{ border-bottom:none; }
  ol.steps > li::before{
    content: counter(step);
    flex:none;
    width:38px; height:38px; border-radius:50%;
    background:var(--part-color, var(--teal)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:18px; margin-top:2px;
  }
  ol.steps > li p{ margin:0; font-size:19px; }
  ol.steps strong{ color:var(--part-color, var(--teal)); }

  .tip{
    margin-top:22px; padding:16px 20px; border-radius:12px;
    border-left:8px solid var(--part-color, var(--teal));
    background: color-mix(in srgb, var(--part-color, var(--teal)) 10%, #fff);
    font-size:18px;
  }
  .tip b{ display:block; margin-bottom:4px; font-size:17px; color:var(--part-color, var(--teal)); }
  .quote{
    margin-top:20px; padding:18px 22px; border-radius:12px;
    background:var(--ink); color:#fff; font-size:19px; font-style:normal;
    text-align:center;
  }

  /* 워크시트 */
  .worksheet-list{ list-style:none; padding:0; margin:20px 0; counter-reset:q; }
  .worksheet-list li{
    counter-increment:q; display:flex; gap:14px; align-items:flex-start;
    padding:16px 6px; border-bottom:1px solid var(--line); font-size:19px;
  }
  .worksheet-list li::before{
    content: counter(q); flex:none;
    width:34px; height:34px; border-radius:8px;
    background:var(--purple-bg); color:var(--purple); font-weight:900;
    display:flex; align-items:center; justify-content:center;
  }
  .answer-line{
    display:block; margin-top:10px; border-bottom:2px solid var(--line); height:26px;
  }

  /* 체크리스트 */
  .checklist{ list-style:none; padding:0; margin:22px 0; }
  .checklist li{
    display:flex; align-items:center; gap:14px; font-size:20px;
    padding:14px 16px; margin-bottom:10px; border-radius:12px;
    background:#FBF8F1; border:2px solid var(--line); cursor:pointer;
  }
  .checklist li.done{ background:var(--teal-bg); border-color:var(--teal); text-decoration:line-through; color:var(--ink-soft); }
  .checklist input{ width:26px; height:26px; accent-color:var(--teal); flex:none; }

  .final-note{
    margin-top:26px; text-align:center; font-size:22px; font-weight:700; color:var(--teal);
  }

  .final-cheer{margin-top:56px;text-align:center;} .final-cheer img{width:100%;max-width:340px;border-radius:20px;box-shadow:var(--shadow);} .final-cheer .cheer-badge{display:inline-block;margin-top:20px;font-size:24px;font-weight:800;color:#B45309;background:#FEF3C7;border:2px solid #F2C879;border-radius:999px;padding:10px 26px;} footer.page-footer{
    text-align:center; color:var(--ink-soft); font-size:14px; margin:40px 0 60px;
  }

  /* 강사 소개 */
  .instructor-wrap{
    display:flex; gap:32px; align-items:center; margin-top:20px; flex-wrap:wrap;
  }
  .instructor-photo{ flex:0 0 260px; text-align:center; }
  .instructor-photo img{
    width:100%; max-width:260px; border-radius:16px; box-shadow:var(--shadow);
  }
  .instructor-info{ flex:1 1 320px; min-width:260px; }
  .instructor-info h3{ font-size:24px; margin:0 0 10px; color:var(--purple); }
  .instructor-info p{ font-size:19px; margin:0 0 14px; }
  .instructor-badges{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .instructor-badges span{
    background:var(--purple-bg); color:var(--purple); font-weight:700; font-size:15px;
    padding:6px 14px; border-radius:999px;
  }

  .instructor-badges{gap:8px!important;} .instructor-badges span{font-size:14px!important;padding:5px 12px!important;line-height:1.4;} .instructor-badges span.badge-award{background:#FEF3C7;color:#B45309;} @media (max-width: 820px){
    body{ font-size:17px; }
    .page{ width:100%; max-width:100%; padding:8mm 6mm; border-radius:0; }
    h1.title{ font-size:32px; }
    h1.part-title{ font-size:27px; }
  }

  @media print{
    body{ background:#fff; }
    .topbar{ display:none; }
    .page{ box-shadow:none; margin:0; border-radius:0; width:auto; max-width:none; page-break-after:always; }
    a[href]:after{ content:""; }
  }
</style>
</head>
<body>
<div id="ais-lock" style="position:fixed;inset:0;z-index:9999;background:#F3ECE0;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;"><div style="background:#FFFDF9;padding:40px 32px;border-radius:16px;box-shadow:0 10px 30px rgba(60,45,20,0.12);max-width:340px;width:90%;text-align:center;"><div style="font-size:22px;font-weight:700;margin-bottom:6px;color:#2A2420;">디지털 자서전과 내 삶의 노래 만들기</div><div style="font-size:15px;color:#5C5248;margin-bottom:20px;">접속 암호를 입력해주세요</div><input id="ais-pw" type="password" placeholder="암호 입력" style="width:100%;font-size:18px;padding:12px 14px;border:2px solid #E7DFCF;border-radius:10px;box-sizing:border-box;margin-bottom:12px;"><button id="ais-pw-btn" style="width:100%;font-size:17px;font-weight:700;padding:12px;border:none;border-radius:10px;background:#0F766E;color:#fff;cursor:pointer;">입장하기</button><div id="ais-pw-err" style="display:none;color:#BE185D;font-size:14px;margin-top:10px;">암호가 올바르지 않습니다.</div></div></div>

<div id="main-content"></div>

<script>
  const LESSON_PAGE = 'ais';

  function initChecklist() {
    var items = document.querySelectorAll('#checklist-items li');
    items.forEach(function(li){
      var key = 'ais-check-' + li.dataset.key;
      var box = li.querySelector('input');
      try{
        if(localStorage.getItem(key) === '1'){ box.checked = true; li.classList.add('done'); }
      }catch(e){}
      function toggle(){
        box.checked = !box.checked;
        li.classList.toggle('done', box.checked);
        try{ localStorage.setItem(key, box.checked ? '1' : '0'); }catch(e){}
      }
      li.addEventListener('click', function(e){
        if(e.target !== box){ toggle(); }
      });
      box.addEventListener('change', function(){
        li.classList.toggle('done', box.checked);
        try{ localStorage.setItem(key, box.checked ? '1' : '0'); }catch(e){}
      });
    });
  }

  function revealContent(html) {
    document.getElementById('main-content').innerHTML = html;
    document.getElementById('ais-lock').style.display = 'none';
    initChecklist();
  }

  async function tryAutoUnlock() {
    try {
      const res = await fetch('/api/lesson-content?page=' + LESSON_PAGE, { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      revealContent(data.html);
    } catch (err) {
      // 자동 인증 실패는 무시하고 잠금 화면을 그대로 둔다.
    }
  }

  (function(){
    var btn = document.getElementById('ais-pw-btn');
    var inp = document.getElementById('ais-pw');
    var err = document.getElementById('ais-pw-err');
    async function tryLogin(){
      btn.disabled = true;
      err.style.display = 'none';
      try {
        const authRes = await fetch('/api/lesson-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ page: LESSON_PAGE, password: inp.value })
        });
        if (!authRes.ok) {
          err.style.display = 'block';
          inp.value = '';
          inp.focus();
          return;
        }
        const contentRes = await fetch('/api/lesson-content?page=' + LESSON_PAGE, { credentials: 'same-origin' });
        if (!contentRes.ok) {
          err.textContent = '콘텐츠를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
          err.style.display = 'block';
          return;
        }
        const data = await contentRes.json();
        revealContent(data.html);
      } catch (e) {
        err.textContent = '오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    }
    btn.addEventListener('click', tryLogin);
    inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ tryLogin(); } });
  })();

  tryAutoUnlock();
</script>

</body>
</html>
